<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vidéo concept Nouvelle Ardoise : le site, les plateformes, les réseaux</title>
<!--
  Vidéo de présentation d'environ 57 s avec voix off, direction « ardoise épurée » : photos plein
  cadre, serif Fraunces, le jaune craie seulement en touches, un seul coup d'éponge.
  Format vertical par défaut (1080×1920) ; video-concept.html?f=16x9 donne la version 1920×1080.
  Les plans et leur durée sont dans voix/plan.js, le texte de la voix dans voix/texte.txt.
  Pasta Mo' (la vraie séquence du site) · le restaurant tel qu'on le trouve en ligne, effacé d'un
  coup d'éponge · le photographe · votre histoire · le site d'Osteria del Lago (démo du site) ·
  Google, réservation, Instagram · les réseaux (tournage, réel, menu du jour, notifications ;
  vidéos Mixkit et Pexels, voir videos/) · le café et le contact de chaque jour · la fin.
  sh videos/extraire-concept.sh, sh voix/generer.sh puis node render-concept.mjs assemblent la vidéo.
-->
<style>
  @font-face { font-family: Brico; src: url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: Instru; src: url(fonts/instrument-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: Fraunces; src: url(fonts/fraunces-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: Fraunces; src: url(fonts/fraunces-latin-wght-italic.woff2) format('woff2'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-wght-normal.woff2) format('woff2'); font-weight: 400 900; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas></canvas>
<script src="ardoise.js"></script>
<script src="videos/concept/index.js"></script>
<script src="voix/plan.js"></script>
<script>
const PAYSAGE = new URLSearchParams(location.search).get('f') === '16x9';
const L = PAYSAGE ? 1920 : 1080, H = PAYSAGE ? 1080 : 1920;
const cv = document.querySelector('canvas');
cv.width = L; cv.height = H; cv.style.width = L + 'px'; cv.style.height = H + 'px';
const ctx = cv.getContext('2d');
const JAUNE = '#FFD23F', ARDOISE = '#1E2A2C';
// la charte d'Osteria del Lago (public/demos/osteria)
const OST = { farine: '#F3EEE2', lac: '#0F2E2C', pomodoro: '#E0452B', tuorlo: '#F5B82E', salvia: '#9DB596' };
const FOND = peindreArdoise(L, H);
const toile = (l, h) => Object.assign(document.createElement('canvas'), { width: Math.ceil(l), height: Math.ceil(h) });

// ---------- outils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (k) => 1 - Math.pow(1 - k, 3);
const douce = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const expo = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
const fonte = (c, taille, graisse = 400, famille = 'Instru', italique = false) => { c.font = `${italique ? 'italic ' : ''}${graisse} ${taille}px ${famille}`; };
const charger = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error(src)); i.src = src; });
const IMG = {}, SEQ = { pastamo: [], salle: [], nouilles: [], cliente: [] };
const plan = (nom, t, t0, vitesse = 1) => { const l = SEQ[nom]; return l[clamp(Math.floor((t - t0) * 30 * vitesse), 0, l.length - 1)]; };

// Image plein cadre dans un rectangle : (fx, fy) = point de l'image placé au centre, z = grossissement
function cadrer(c, img, fx = 0.5, fy = 0.5, z = 1, { x = 0, y = 0, l = L, h = H, rayon = 0, alpha = 1 } = {}) {
  const s = Math.max(l / img.width, h / img.height) * z;
  const w = img.width * s, hh = img.height * s;
  const ix = clamp(x + l / 2 - fx * w, x + l - w, x), iy = clamp(y + h / 2 - fy * hh, y + h - hh, y);
  c.save(); c.globalAlpha *= alpha;
  if (rayon) { c.beginPath(); c.roundRect(x, y, l, h, rayon); c.clip(); }
  c.drawImage(img, ix, iy, w, hh);
  c.restore();
}
function voile(c, haut, bas, force) {
  const g = c.createLinearGradient(0, haut, 0, bas);
  g.addColorStop(0, 'rgba(10,14,15,0)'); g.addColorStop(1, `rgba(10,14,15,${force})`);
  c.fillStyle = g; c.fillRect(0, Math.min(haut, bas), L, Math.abs(bas - haut));
}
function ardoise(c) { c.drawImage(FOND, 0, 0); }

// ---------- les titres : serif, un mot en italique souligné à la craie ----------
// lignes : [[texte, accent], …] par ligne. pos : 'haut' ou 'bas'
const T = PAYSAGE ? { taille: 84, sur: 24, marge: 150 } : { taille: 100, sur: 28, marge: 90 };
function titre(c, t, t0, sur, lignes, { pos = 'haut', ombre = false, centre = !PAYSAGE, x0 = T.marge, y0 } = {}) {
  const taille = T.taille, interligne = taille * 1.1;
  const hauteur = lignes.length * interligne;
  let y = y0 ?? (PAYSAGE
    ? (pos === 'haut' ? H / 2 - hauteur / 2 + taille * 0.4 : H - 130 - hauteur + taille * 0.85)
    : (pos === 'haut' ? 250 : H - 260 - hauteur + taille));
  // le surtitre : petites capitales espacées, en jaune
  if (sur) {
    const k = sortie(prog(t, t0, t0 + 0.6));
    c.save();
    fonte(c, T.sur, 600, 'Instru'); c.letterSpacing = `${T.sur * 0.22}px`;
    c.textAlign = centre ? 'center' : 'left'; c.globalAlpha = k;
    c.fillStyle = JAUNE;
    if (ombre) { c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 20; }
    c.fillText(sur.toUpperCase(), centre ? L / 2 : x0, y - taille * 1.05 + (1 - k) * 12);
    c.restore();
  }
  lignes.forEach((segments, i) => {
    const ti = t0 + 0.12 + i * 0.13;
    const k = expo(prog(t, ti, ti + 0.9));
    if (k <= 0) return;
    const largeurs = segments.map(([texte, accent]) => { fonte(c, taille, accent ? 380 : 340, 'Fraunces', accent); return c.measureText(texte).width; });
    const total = largeurs.reduce((a, b) => a + b, 0);
    let x = centre ? L / 2 - total / 2 : x0;
    c.save();
    c.beginPath(); c.rect(0, y - taille * 1.0, L, taille * 1.35); c.clip();
    const dy = (1 - k) * taille * 1.1;
    segments.forEach(([texte, accent], j) => {
      c.save();
      fonte(c, taille, accent ? 380 : 340, 'Fraunces', accent);
      c.fillStyle = '#F6F3EC';
      if (ombre) { c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 30; c.shadowOffsetY = 4; }
      c.fillText(texte, x, y + dy);
      c.restore();
      if (accent) {
        // le trait de craie jaune sous le mot, comme sous « Ardoise » dans le logo
        const p = douce(prog(t, ti + 0.55, ti + 1.05));
        const w = largeurs[j] - (texte.endsWith('.') ? taille * 0.28 : 0);
        if (p > 0) {
          const yy = y + taille * 0.2;
          craie(c, (cc) => {
            cc.strokeStyle = JAUNE; cc.lineWidth = taille * 0.075; cc.lineCap = 'round';
            cc.beginPath(); cc.moveTo(x + 6, yy + 3);
            cc.quadraticCurveTo(x + w * p * 0.5, yy - 5, x + 6 + (w - 12) * p, yy + 1); cc.stroke();
          });
        }
      }
      x += largeurs[j];
    });
    c.restore();
    y += interligne;
  });
}

// ---------- le téléphone : écran logique de 390 × 844 ----------
const ECRAN = { w: 390, h: 844 };
const BORD = 14;
function geoTel(cx, cy, hauteur) {
  const s = hauteur / (ECRAN.h + BORD * 2);
  const W = (ECRAN.w + BORD * 2) * s;
  return { s, W, H: hauteur, ex: cx - W / 2 + BORD * s, ey: cy - hauteur / 2 + BORD * s };
}
function telephone(c, cx, cy, hauteur, dessin, { alpha = 1, echelle = 1, dy = 0 } = {}) {
  const g = geoTel(cx, cy, hauteur);
  c.save();
  c.globalAlpha *= alpha;
  c.translate(cx, cy + dy); c.scale(echelle, echelle); c.translate(-cx, -cy);
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 70 * g.s; c.shadowOffsetY = 30 * g.s;
  c.fillStyle = '#0B0D0E';
  c.beginPath(); c.roundRect(cx - g.W / 2, cy - g.H / 2, g.W, g.H, 64 * g.s); c.fill();
  c.shadowColor = 'transparent';
  c.strokeStyle = '#3A4245'; c.lineWidth = 2.5 * g.s; c.stroke();
  c.save();
  c.beginPath(); c.roundRect(g.ex, g.ey, ECRAN.w * g.s, ECRAN.h * g.s, 52 * g.s); c.clip();
  c.translate(g.ex, g.ey); c.scale(g.s, g.s);
  dessin(c, g);
  c.restore();
  c.fillStyle = '#000';
  c.beginPath(); c.roundRect(cx - 56 * g.s, g.ey + 12 * g.s, 112 * g.s, 33 * g.s, 17 * g.s); c.fill();
  c.restore();
  return g;
}
function barreEtat(c, couleur) {
  fonte(c, 16, 600); c.fillStyle = couleur; c.textAlign = 'left';
  c.fillText('9:41', 34, 36);
  c.fillRect(318, 26, 22, 11); c.fillRect(344, 24, 12, 14);
}
function photo(c, img, x, y, w, h, r = 0, fx = 0.5, fy = 0.5, z = 1) { cadrer(c, img, fx, fy, z, { x, y, l: w, h, rayon: r }); }
function texte(c, s, x, y, taille, { graisse = 400, famille = 'Instru', couleur = '#000', aligne = 'left', italique = false, alpha = 1 } = {}) {
  c.save(); fonte(c, taille, graisse, famille, italique); c.fillStyle = couleur; c.textAlign = aligne; c.globalAlpha *= alpha;
  c.fillText(s, x, y); c.restore();
}
function pastille(c, x, y, w, h, fond, s, couleur, taille = 15, graisse = 600) {
  c.fillStyle = fond; c.beginPath(); c.roundRect(x, y, w, h, h / 2); c.fill();
  texte(c, s, x + w / 2, y + h / 2 + taille * 0.36, taille, { graisse, couleur, aligne: 'center' });
}
function etoiles(c, x, y, n, taille, couleur = JAUNE, vide = '#C9C4B8') {
  for (let i = 0; i < 5; i++) {
    c.save(); c.translate(x + i * taille * 1.15, y); c.beginPath();
    for (let k = 0; k < 10; k++) { const r = k % 2 ? taille * 0.22 : taille * 0.5, a = -Math.PI / 2 + k * Math.PI / 5; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    c.closePath(); c.fillStyle = i < n ? couleur : vide; c.fill(); c.restore();
  }
}
// le doigt : un rond clair, et une onde quand il touche
function doigt(c, x, y, tTouche, t, alpha = 1) {
  const k = prog(t, tTouche, tTouche + 0.5);
  c.save(); c.globalAlpha *= alpha;
  if (t >= tTouche && k < 1) {
    c.strokeStyle = `rgba(255,255,255,${0.8 * (1 - k)})`; c.lineWidth = 4;
    c.beginPath(); c.arc(x, y, 26 + 50 * sortie(k), 0, Math.PI * 2); c.stroke();
  }
  const enfonce = t >= tTouche && t < tTouche + 0.15 ? 0.85 : 1;
  c.fillStyle = 'rgba(255,255,255,0.55)'; c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = 2;
  c.beginPath(); c.arc(x, y, 28 * enfonce, 0, Math.PI * 2); c.fill(); c.stroke();
  c.restore();
}

// Chaque plan reçoit u, le temps depuis son début, et D, sa durée (voix/plan.js).
const TEL = PAYSAGE ? { cx: L * 0.7, cy: H / 2 + 10, h: H * 0.86 } : { cx: L / 2, cy: H * 0.6, h: H * 0.6 };
const L1 = (...segs) => segs.map((s) => (Array.isArray(s) ? s : [s, false]));

// ---------- Pasta Mo' : « Votre cuisine est belle. » ----------
function scenePastamo(c, u, D) {
  const img = SEQ.pastamo[clamp(Math.floor(u / D * 37), 0, 36)];
  cadrer(c, img, 0.5, PAYSAGE ? 0.5 : 0.52, mix(PAYSAGE ? 1.02 : 1.08, PAYSAGE ? 1.1 : 1.16, douce(prog(u, 0, D))));
  voile(c, H * (PAYSAGE ? 0.4 : 0.5), H, 0.92);
  titre(c, u, 0.3, '', [L1('Votre cuisine'), L1('est ', ['belle.', true])], { pos: 'bas', ombre: true, x0: PAYSAGE ? L * 0.66 : T.marge });
}

// ---------- En ligne, personne ne la voit, puis le coup d'éponge ----------
let ecranVieux;
function vieuxSite(c) {
  c.fillStyle = '#ECECEC'; c.fillRect(0, 0, ECRAN.w, ECRAN.h);
  barreEtat(c, '#333');
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(18, 62, 354, 46, 23); c.fill();
  texte(c, 'osteria del lago genève', 46, 92, 16, { couleur: '#555' });
  // fiche sans photo
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(18, 126, 354, 230, 18); c.fill();
  c.fillStyle = '#DADADA'; c.beginPath(); c.roundRect(32, 140, 326, 110, 10); c.fill();
  texte(c, 'Aucune photo', 195, 202, 15, { couleur: '#999', aligne: 'center' });
  texte(c, 'Osteria del Lago', 34, 284, 20, { graisse: 600, couleur: '#333' });
  etoiles(c, 42, 306, 3, 15, '#E8A93A', '#CCC');
  texte(c, '3,1 · 12 avis', 130, 311, 14, { couleur: '#888' });
  texte(c, 'Horaires non renseignés', 34, 338, 14, { couleur: '#B04A3A' });
  // le menu en PDF
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(18, 372, 354, 76, 18); c.fill();
  c.fillStyle = '#D9443A'; c.beginPath(); c.roundRect(32, 386, 44, 48, 6); c.fill();
  texte(c, 'PDF', 54, 416, 13, { graisse: 700, couleur: '#fff', aligne: 'center' });
  texte(c, 'menu_2019_final.pdf', 90, 406, 16, { graisse: 600, couleur: '#333' });
  texte(c, '4,2 Mo · téléchargement…', 90, 428, 13, { couleur: '#999' });
  // Instagram endormi
  c.fillStyle = '#fff'; c.beginPath(); c.roundRect(18, 464, 354, 300, 18); c.fill();
  c.fillStyle = '#D0D0D0'; c.beginPath(); c.arc(60, 512, 26, 0, Math.PI * 2); c.fill();
  texte(c, 'osteria_lago', 100, 506, 16, { graisse: 600, couleur: '#333' });
  texte(c, '3 publications', 100, 528, 13, { couleur: '#999' });
  texte(c, 'Dernière publication : il y a 47 semaines', 34, 576, 13.5, { couleur: '#B04A3A' });
  for (let i = 0; i < 3; i++) { c.fillStyle = ['#D6D6D6', '#CFCFCF', '#DADADA'][i]; c.fillRect(34 + i * 109, 596, 105, 105); }
  // la poussière
  const r = hasard(21);
  c.fillStyle = 'rgba(120,110,95,0.10)'; c.fillRect(0, 0, ECRAN.w, ECRAN.h);
  for (let i = 0; i < 260; i++) { c.fillStyle = `rgba(90,80,70,${0.05 + r() * 0.12})`; c.beginPath(); c.arc(r() * 390, r() * 844, 0.6 + r() * 1.8, 0, 7); c.fill(); }
}
function sceneProbleme(c, u, D) {
  ardoise(c);
  titre(c, u, 0.1, '', [L1('En ligne,'), L1('personne ', ['ne la voit.', true])]);
  const g = geoTel(TEL.cx, TEL.cy, TEL.h);
  if (!ecranVieux) ecranVieux = toile(ECRAN.w * g.s, ECRAN.h * g.s);
  const vc = ecranVieux.getContext('2d');
  vc.setTransform(g.s, 0, 0, g.s, 0, 0); vc.globalCompositeOperation = 'source-over';
  vieuxSite(vc);
  vc.setTransform(1, 0, 0, 1, 0, 0);
  const p = douce(prog(u, D - 1.45, D - 0.2));
  let tete = null;
  if (p > 0) tete = essuyage(vc, p, { l: ecranVieux.width, h: ecranVieux.height, bande: ecranVieux.width * 0.42, passes: 5 });
  const k = sortie(prog(u, 0.1, 0.9));
  telephone(c, TEL.cx, TEL.cy, TEL.h, (cc) => {
    siteOsteria(cc, 0);
    cc.drawImage(ecranVieux, 0, 0, ECRAN.w, ECRAN.h);
  }, { alpha: k, dy: (1 - k) * 80 });
  if (tete && p < 1) {
    c.save(); c.globalAlpha = clamp(Math.min(p * 8, (1 - p) * 8));
    brosse(c, g.ex + tete[0], g.ey + tete[1], g.W * 0.62, tete[0] > ecranVieux.width / 2 ? -0.1 : 0.1);
    c.restore();
  }
}

// ---------- Un photographe chez vous : déclenchements sur les plats ----------
const CLICHES = [['burrata', 0.5, 0.45], ['ragu', 0.5, 0.5], ['pesto', 0.5, 0.5], ['tiramisu', 0.5, 0.5], ['pomodoro', 0.5, 0.5]];
function scenePhotographe(c, u, D) {
  const pas = D / CLICHES.length;
  const i = clamp(Math.floor(u / pas), 0, CLICHES.length - 1), v = u - i * pas;
  const [nom, fx, fy] = CLICHES[i];
  // la mise au point : léger flou qui se resserre, puis le déclenchement
  const net = sortie(prog(v, 0, 0.35));
  c.save();
  if (net < 1) c.filter = `blur(${(1 - net) * 10}px)`;
  cadrer(c, IMG[nom], fx, fy, mix(1.16, 1.1, net) + v * 0.02);
  c.restore();
  voile(c, H * 0.5, H, 0.8);
  // la grille du viseur et le cadre de mise au point
  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = 2;
  for (const f of [1 / 3, 2 / 3]) { c.beginPath(); c.moveTo(L * f, 0); c.lineTo(L * f, H); c.moveTo(0, H * f); c.lineTo(L, H * f); c.stroke(); }
  const taille = mix(300, 220, net), cx = L / 2, cy = H * (PAYSAGE ? 0.45 : 0.42), b = 40;
  c.strokeStyle = net >= 1 ? JAUNE : 'rgba(255,255,255,0.9)'; c.lineWidth = 5; c.lineCap = 'round';
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
    const x = cx + sx * taille / 2, y = cy + sy * taille / 2;
    c.beginPath(); c.moveTo(x, y - sy * b); c.lineTo(x, y); c.lineTo(x - sx * b, y); c.stroke();
  });
  texte(c, 'f/2.8   1/125   ISO 400', L / 2, PAYSAGE ? 80 : 120, PAYSAGE ? 26 : 30, { graisse: 600, couleur: 'rgba(255,255,255,0.85)', aligne: 'center' });
  c.restore();
  // l'éclair du déclenchement, à chaque changement de plat
  if (i > 0 || u > 0.05) {
    const e = prog(v, 0, 0.18);
    if (e < 1 && i > 0) { c.fillStyle = `rgba(255,255,255,${0.85 * (1 - e)})`; c.fillRect(0, 0, L, H); }
  }
  titre(c, u, 0.2, '', [L1('Un photographe,'), L1(['chez vous.', true])], { pos: 'bas', ombre: true });
}

// ---------- On raconte votre histoire ----------
function sceneHistoire(c, u, D) {
  cadrer(c, IMG.salle, mix(0.42, 0.55, u / D), 0.5, mix(1.12, 1.2, douce(u / D)));
  voile(c, H * 0.4, H, 0.88);
  titre(c, u, 0.25, 'On vous écoute', [L1('Votre histoire,'), L1(['à votre image.', true])], { pos: 'bas', ombre: true });
}

// ---------- Le site : « Un site qui donne faim. » ----------
const TAP = { heure: 4.55, ok: 5.25 };
function siteOsteria(c, u) {
  c.fillStyle = OST.farine; c.fillRect(0, 0, ECRAN.w, ECRAN.h);
  const defile = 560 * douce(prog(u, 1.9, 3.1)) + 470 * douce(prog(u, 3.5, 4.3));
  c.save(); c.translate(0, -defile);
  const kp = u > 0 ? expo(prog(u, 0.35, 1.5)) : 1;
  c.save(); c.beginPath(); c.rect(0, 0, ECRAN.w, 560 * kp); c.clip();
  photo(c, IMG.ragu, 0, 0, ECRAN.w, 560, 0, 0.5, 0.55, mix(1.25, 1.05, kp) + u * 0.01);
  const gr = c.createLinearGradient(0, 280, 0, 560); gr.addColorStop(0, 'rgba(15,46,44,0)'); gr.addColorStop(1, 'rgba(15,46,44,0.85)');
  c.fillStyle = gr; c.fillRect(0, 280, ECRAN.w, 280);
  const kt = u > 0 ? sortie(prog(u, 0.9, 1.6)) : 1;
  texte(c, 'Pâtes fraîches,', 24, 470 + (1 - kt) * 20, 36, { famille: 'Bodoni', graisse: 500, couleur: OST.farine, alpha: kt });
  texte(c, 'au bord du lac.', 24, 512 + (1 - kt) * 20, 36, { famille: 'Bodoni', graisse: 500, couleur: OST.farine, alpha: kt, italique: true });
  c.restore();
  texte(c, 'La carte', 24, 626, 34, { famille: 'Bodoni', graisse: 500, couleur: OST.lac });
  let fx = 24;
  [['Végétarien', 112], ['Épicé', 76], ['EN', 52]].forEach(([f, w], i) => {
    const actif = i === 0 && u > 2.6;
    c.strokeStyle = OST.lac; c.lineWidth = 1.5; c.fillStyle = actif ? OST.lac : 'transparent';
    c.beginPath(); c.roundRect(fx, 648, w, 34, 17); c.fill(); c.stroke();
    texte(c, f, fx + w / 2, 670, 14, { graisse: 600, couleur: actif ? OST.farine : OST.lac, aligne: 'center' });

    cc.beginPath(); cc.ellipse(cx, cy + 110, 190, 26, 0, 0, Math.PI * 2); cc.stroke();
    cc.setLineDash([]);
    cc.strokeStyle = JAUNE; cc.lineWidth = 7;

  if (k2 > 0) {
    c.save(); c.globalAlpha = k2; c.translate(0, (1 - k2) * 20);
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(20, 450, 270, 92, 16); c.fill();
    texte(c, 'Merci ! C’est en ligne sur le site,', 34, 480, 15.5, { couleur: '#111' });
    texte(c, 'Google et Instagram.', 34, 502, 15.5, { couleur: '#111' });
    texte(c, '7:43  ✓✓', 278, 530, 11, { couleur: '#3B82C4', aligne: 'right' });
    c.restore();
  }
  // 3. le plat du jour publié, en aperçu
  const k3 = sortie(prog(u, 1.9, 2.4));
  if (k3 > 0) {
    c.save(); c.globalAlpha = k3; c.translate(0, (1 - k3) * 20);
    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(20, 556, 270, 200, 16); c.fill();
    photo(c, IMG.perche, 28, 564, 254, 140, 10);
    texte(c, 'Plat du jour : filets de perche', 34, 730, 14.5, { graisse: 600, couleur: '#111' });
    c.restore();
  }
}
function sceneContact(c, u, D) {
  ardoise(c);
  const bascule = 2.6;
  const a1 = 1 - prog(u, bascule - 0.3, bascule);
  if (a1 > 0) {
    c.save(); c.globalAlpha *= a1;
    titre(c, u, 0.1, 'Confiance', [L1('Tout commence'), L1('par ', ['un café.', true])]);
    tasse(c, TEL.cx, TEL.cy, douce(prog(u, 0.2, 1.4)), u);
    c.restore();
  }
  if (u > bascule - 0.3) {
    const a2 = prog(u, bascule - 0.1, bascule + 0.3);
    c.save(); c.globalAlpha *= a2;
    titre(c, u, bascule, '', [L1('On se parle'), L1(['chaque jour.', true])]);
    c.restore();
    const k = expo(prog(u, bascule, bascule + 0.8));
    telephone(c, TEL.cx, TEL.cy, TEL.h, (cc) => conversation(cc, u - bascule - 0.3), { alpha: k, dy: (1 - k) * 100 });
  }
}

// ---------- La fin ----------
function sceneFin(c, u, D) {
  ardoise(c);
  const echelle = PAYSAGE ? 0.85 : 1;
  const cy = PAYSAGE ? H * 0.3 : H * 0.33;
  const taille = 150 * echelle;
  const kN = douce(prog(u, 0.1, 0.9));
  fonte(c, 84 * echelle, 650, 'Brico');
  const largeurNom = c.measureText('Nouvelle').width;
  const x0 = L / 2 - (taille + 40 * echelle + largeurNom) / 2;
  nLumineux(c, x0, cy - taille * 0.43, taille, { trace: kN, eclat: 0.5 + 0.5 * prog(u, 0.8, 1.3) });
  const kNom = sortie(prog(u, 0.6, 1.3));
  const xn = x0 + taille + 40 * echelle + (1 - kNom) * 20;
  c.save(); c.globalAlpha *= kNom;
  fonte(c, 84 * echelle, 650, 'Brico'); c.fillStyle = '#F6F3EC'; c.letterSpacing = '-1px';
  c.fillText('Nouvelle', xn, cy - 8 * echelle);
  c.fillText('Ardoise', xn, cy + 74 * echelle);
  const lArd = c.measureText('Ardoise').width;
  c.restore();
  if (kNom > 0) traitJaune(c, xn + 2, cy + 98 * echelle, lArd * 0.98, douce(prog(u, 1.0, 1.5)));
  const yP = PAYSAGE ? H * 0.56 : H * 0.53;
  const k1 = sortie(prog(u, 1.3, 2.0)), k2 = sortie(prog(u, 1.6, 2.3));
  c.save(); c.textAlign = 'center';
  fonte(c, PAYSAGE ? 50 : 58, 340, 'Fraunces'); c.fillStyle = 'rgba(246,243,236,0.8)'; c.globalAlpha *= k1;
  c.fillText('Site, plateformes, réseaux :', L / 2, yP + (1 - k1) * 20);
  c.restore();
  c.save(); c.textAlign = 'center';
  fonte(c, PAYSAGE ? 70 : 82, 380, 'Fraunces', true); c.fillStyle = '#F6F3EC'; c.globalAlpha *= k2;
  c.fillText('on s’occupe de tout.', L / 2, yP + (PAYSAGE ? 90 : 104) + (1 - k2) * 20);
  c.restore();
  const k3 = expo(prog(u, 2.3, 3.0));
  const yB = PAYSAGE ? H * 0.72 : H * 0.68;
  const bw = PAYSAGE ? 460 : 560, bh = PAYSAGE ? 92 : 110;
  const pouls = 1 + 0.025 * Math.sin(Math.max(0, u - 3) * 5);
  c.save(); c.globalAlpha *= k3; c.translate(L / 2, yB + bh / 2); c.scale(mix(0.9, 1, k3) * pouls, mix(0.9, 1, k3) * pouls);
  c.fillStyle = JAUNE; c.beginPath(); c.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2); c.fill();
  const tb = PAYSAGE ? 36 : 42;
  texte(c, 'Prenons un café', 0, tb * 0.36, tb, { graisse: 650, couleur: ARDOISE, aligne: 'center' });
  c.restore();
  const k4 = sortie(prog(u, 2.7, 3.3));
  texte(c, 'WhatsApp 078 213 38 68', L / 2, yB + bh + (PAYSAGE ? 64 : 84), PAYSAGE ? 34 : 40, { graisse: 600, couleur: '#F6F3EC', aligne: 'center', alpha: k4 });
  texte(c, 'nouvelleardoise.ch', L / 2, yB + bh + (PAYSAGE ? 112 : 142), PAYSAGE ? 30 : 34, { couleur: 'rgba(246,243,236,0.7)', aligne: 'center', alpha: k4 });
}

// ---------- le montage : les plans de voix/plan.js, fondus de 0,4 s ----------
const SCENES = { pastamo: scenePastamo, probleme: sceneProbleme, photographe: scenePhotographe, histoire: sceneHistoire, site: sceneSite, plateformes: scenePlateformes, tournage: sceneTournage, reel: sceneReel, calendrier: sceneCalendrier, notifs: sceneNotifs, cuisinez: sceneCuisinez, contact: sceneContact, fin: sceneFin };
let debut = 0;
const PLANS = window.PLAN.map((p) => { const r = { ...p, debut, f: SCENES[p.id] }; debut += p.duree; return r; });
const DUREE = debut;
window.DUREE = DUREE;
const FONDU = 0.4;
window.rendu = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, L, H);
  PLANS.forEach((p, i) => {
    const a = i === 0 ? 0 : p.debut - FONDU / 2, b = i === PLANS.length - 1 ? DUREE + 1 : p.debut + p.duree + FONDU / 2;
    if (t < a || t >= b) return;
    ctx.save();
    ctx.globalAlpha = i === 0 ? 1 : clamp((t - a) / FONDU);
    p.f(ctx, t - p.debut, p.duree);
    ctx.restore();
  });
};

window.pret = (async () => {
  const fonts = ['400 20px Instru', '600 20px Instru', '700 20px Instru', '340 20px Fraunces', 'italic 380 20px Fraunces', '500 20px Bodoni', '600 20px Bodoni', 'italic 500 20px Bodoni', '650 20px Brico'];
  await Promise.all(fonts.map((f) => document.fonts.load(f)));
  const photos = ['ragu', 'burrata', 'pesto', 'tiramisu', 'perche', 'salle', 'ramen', 'pomodoro'];
  await Promise.all(photos.map(async (p) => { IMG[p] = await charger(`../../../src/assets/photo-${p}.jpg`); }));
  IMG.ardoise = await charger('photos/menu-du-jour-ardoise.jpg');
  const n = (i) => String(i).padStart(3, '0');
  const seq = [['pastamo', 37, (i) => `../../../public/sequences/pastamo/g/${n(i)}.webp`]]
    .concat(Object.entries(window.VIDEOS).map(([k, v]) => [k, v, (i) => `videos/concept/${k}/${n(i)}.jpg`]));
  await Promise.all(seq.map(async ([k, v, src]) => { SEQ[k] = await Promise.all(Array.from({ length: v }, (_, i) => charger(src(i + 1)))); }));
  window.rendu(0);
})();
