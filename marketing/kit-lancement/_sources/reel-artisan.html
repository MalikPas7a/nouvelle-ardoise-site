<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réel « artisan » : le savoir-faire, la boutique, les distinctions</title>
<!--
  Réel Instagram 24 s, 1080×1920, pour les artisans de bouche (chocolatiers, pâtissiers).
  Exemple : Maison Fève, chocolatier inventé à Carouge, dans la charte de la page Artisans du site
  (crème, cacao, Bodoni Moda). Ce qu'un réel d'artisan doit montrer :
  1. L'accroche : le chocolat coulé, « ce que vos clients ne voient jamais ».
  2. Où est la boutique : plongée sur Carouge (SWISSIMAGE © swisstopo,
     python3 vue-aerienne.py 46.18370 6.13930 carte-carouge).
  3. Le savoir-faire : tempérage et raclage filmés à l'atelier (« REC »).
  4. Ce qu'on offre : la création finie, en grand, et la gamme.
  5. Les distinctions et labels, mis en avant (fictifs ici, marqués « exemple »).
  6. Où et quand venir, commande en click and collect.
  7. L'appel à l'action Nouvelle Ardoise.
  sh videos/extraire-artisan.sh <vidéos Pexels> puis REEL=reel-artisan node render.mjs assemblent la vidéo.
-->
<style>
  @font-face { font-family: Brico; src: url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: Instru; src: url(fonts/instrument-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-standard-normal.woff2) format('woff2'); font-weight: 400 900; }
  @font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-standard-italic.woff2) format('woff2'); font-weight: 400 900; font-style: italic; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<script src="ardoise.js"></script>
<script src="carte-carouge/index.js"></script>
<script src="videos/images-artisan/index.js"></script>
<script>
const L = 1080, H = 1920, DUREE = 24;
window.DUREE = DUREE;
const JAUNE = '#FFD23F', ARDOISE = '#1E2A2C';
// la charte de la page Artisans (src/styles/global.css)
const M = { creme: '#F6F0E7', cacao: '#2A1E18', brun: '#6B5A4C', or: '#B08A4E', orClair: '#E3C68C' };
const ctx = document.querySelector('canvas').getContext('2d');
const FOND = peindreArdoise(L, H);
const toile = (l, h) => Object.assign(document.createElement('canvas'), { width: l, height: h });

// ---------- outils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (k) => 1 - Math.pow(1 - k, 3);
const entree = (k) => k * k * k;
const dansSortie = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const lisse = (k) => k * k * k * (k * (k * 6 - 15) + 10);
const rebond = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const police = (c, taille, graisse = 800, famille = 'Brico', style = 'normal') => { c.font = `${style} ${graisse} ${taille}px ${famille}`; };
const charger = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
const IMAGES = Object.fromEntries(Object.keys(window.VIDEOS).map((k) => [k, []]));
const image = (plan, t, t0) => { const l = IMAGES[plan]; return l[clamp(Math.floor((t - t0) * 30), 0, l.length - 1)]; };

function cadrer(c, img, fx, fy, z = 1, { flou = 0, alpha = 1, l = L, h = H } = {}) {
  const s = Math.max(l / img.width, h / img.height) * z;
  const w = img.width * s, hh = img.height * s;
  const x = clamp(l / 2 - fx * w, l - w, 0), y = clamp(h / 2 - fy * hh, h - hh, 0);
  c.save(); c.globalAlpha *= alpha;
  if (flou > 0.2) c.filter = `blur(${flou}px)`;
  c.drawImage(img, x, y, w, hh);
  c.restore();
}
// voile sombre du haut de l'image vers le bas, pour lire les titres
function voileHaut(c, h, force) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `rgba(20,14,10,${force})`); g.addColorStop(1, 'rgba(20,14,10,0)');
  c.fillStyle = g; c.fillRect(0, 0, L, h);
}
function degrade(c, haut, bas, force, teinte = '20,14,10') {
  const g = c.createLinearGradient(0, haut, 0, bas);
  g.addColorStop(0, `rgba(${teinte},${haut < bas ? 0 : force})`); g.addColorStop(1, `rgba(${teinte},${haut < bas ? force : 0})`);
  c.fillStyle = g; c.fillRect(0, Math.min(haut, bas), L, Math.abs(bas - haut));
}

// Une ligne de titre en Bodoni : les mots arrivent l'un après l'autre ; ceux de « italiques » sont en italique doré
function titre(c, mots, t, t0, y, taille, { fin = 1e9, couleur = '#fff', italiques = [], ombre = true, ecart = 0.07 } = {}) {
  c.textBaseline = 'alphabetic';
  const mesure = (m, j) => { police(c, taille, 500, 'Bodoni', italiques.includes(j) ? 'italic' : 'normal'); return c.measureText(m).width; };
  const espace = taille * 0.26;
  const largeurs = mots.map(mesure);
  let x = (L - largeurs.reduce((a, b) => a + b, 0) - espace * (mots.length - 1)) / 2;
  const kOut = prog(t, fin, fin + 0.25);
  mots.forEach((m, j) => {
    const k = sortie(prog(t, t0 + j * ecart, t0 + j * ecart + 0.45));
    if (k > 0 && kOut < 1) {
      c.save();
      c.globalAlpha = k * (1 - kOut);
      c.translate(x, y + (1 - k) * 30 - kOut * 20);
      police(c, taille, 500, 'Bodoni', italiques.includes(j) ? 'italic' : 'normal');
      c.fillStyle = italiques.includes(j) ? (couleur === '#fff' ? M.orClair : M.or) : couleur;
      if (ombre) { c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 30; c.shadowOffsetY = 4; }
      c.textAlign = 'left';
      c.fillText(m, 0, 0);
      c.restore();
    }
    x += largeurs[j] + espace;
  });
}
function sousTitre(c, texte, t, t0, y, { fin = 1e9, couleur = 'rgba(255,255,255,0.85)', taille = 40 } = {}) {
  const k = sortie(prog(t, t0, t0 + 0.4)) * (1 - prog(t, fin, fin + 0.25));
  if (k <= 0) return;
  c.save(); c.globalAlpha = k;
  police(c, taille, 500, 'Instru'); c.fillStyle = couleur; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 16;
  c.fillText(texte, L / 2, y + (1 - k) * 16);
  c.restore();
}
// cadre de caméra « REC » : on tourne chez l'artisan
function repere(c, t, t0, t1) {
  const k = prog(t, t0, t0 + 0.2) * (1 - prog(t, t1, t1 + 0.15));
  if (k <= 0) return;
  c.save(); c.globalAlpha = k;
  const y = 560;
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 5;
  [[60, y, 1, 1], [L - 60, y, -1, 1], [60, y + 1120, 1, -1], [L - 60, y + 1120, -1, -1]].forEach(([x, yy, sx, sy]) => {
    c.beginPath(); c.moveTo(x, yy + sy * 70); c.lineTo(x, yy); c.lineTo(x + sx * 70, yy); c.stroke();
  });
  if (Math.floor(t * 2) % 2 === 0) { c.fillStyle = '#FF3B30'; c.beginPath(); c.arc(110, y + 60, 14, 0, 7); c.fill(); }
  police(c, 30, 700, 'Instru'); c.fillStyle = '#fff'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('REC', 136, y + 61);
  c.restore();
}

// ---------- 1. l'accroche : le chocolat coulé (0 → 3,4 s) ----------
function accroche(c, t) {
  if (t > 3.5) return;
  cadrer(c, image('coulee', t, 0), 0.5, 0.5, mix(1.0, 1.08, prog(t, 0, 3.4)));
  voileHaut(c, 820, 0.6);
  titre(c, ['Ce', 'que', 'vos', 'clients'], t, 0.15, 330, 104, { fin: 3.1 });
  titre(c, ['ne', 'voient', 'jamais.'], t, 0.45, 460, 104, { fin: 3.1, italiques: [1, 2] });
}

// ---------- 2. la plongée sur Carouge (3,1 → 7,8 s) ----------
const NIVEAUX = Object.keys(window.CARTE).map(Number).sort((a, b) => a - b);
const MOSAIQUES = {};
const D0 = 3.3;
const zoomA = (t) => mix(11, 19.2, lisse(prog(t, D0, D0 + 3.0))) + 1.5 * entree(prog(t, D0 + 3.6, D0 + 4.4));
function niveau(c, z, Z, alpha) {
  const img = MOSAIQUES[z], p = window.CARTE[z];
  if (!img || alpha <= 0) return;
  const s = Math.pow(2, Z - z);
  c.save(); c.globalAlpha = alpha;
  c.translate(L / 2, H * 0.52); c.scale(s, s); c.translate(-p.x, -p.y);
  c.drawImage(img, 0, 0);
  c.restore();
}
const vue = toile(L, H), vctx = vue.getContext('2d');
function aerien(c, t) {
  if (t < 3.1 || t > D0 + 4.6) return;
  const Z = zoomA(t);
  vctx.fillStyle = '#1B2426'; vctx.fillRect(0, 0, L, H);
  const z = clamp(Math.floor(Z), NIVEAUX[0], NIVEAUX[NIVEAUX.length - 1]);
  niveau(vctx, z - 1, Z, 1);
  niveau(vctx, z, Z, 1);
  niveau(vctx, z + 1, Z, lisse(clamp((Z - z - 0.45) / 0.55)));
  c.save();
  // l'accroche s'ouvre en cercle sur la vue du ciel
  const ko = dansSortie(prog(t, 3.1, 3.6));
  c.beginPath(); c.arc(L / 2, H * 0.52, ko * H, 0, 7); c.clip();
  c.drawImage(vue, 0, 0);
  c.fillStyle = 'rgba(42,30,24,0.12)'; c.fillRect(0, 0, L, H);
  voileHaut(c, 760, 0.72);
  const vig = c.createRadialGradient(L / 2, H * 0.52, H * 0.3, L / 2, H * 0.52, H * 0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  c.fillStyle = vig; c.fillRect(0, 0, L, H);
  police(c, 26, 500, 'Instru'); c.fillStyle = 'rgba(255,255,255,0.75)'; c.textAlign = 'left';
  c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 8; c.fillText('Images aériennes © swisstopo', 40, H - 46);
  c.restore();
  epingle(c, t);
  titre(c, ['Votre', 'boutique,'], t, D0 + 0.4, 260, 108, { fin: D0 + 4.0 });
  titre(c, ['votre', 'quartier.'], t, D0 + 0.6, 390, 108, { fin: D0 + 4.0, italiques: [1] });
}
function epingle(c, t) {
  const k = prog(t, D0 + 2.6, D0 + 3.0);
  if (k <= 0) return;
  const out = prog(t, D0 + 4.0, D0 + 4.3);
  const x = L / 2, sol = H * 0.52;
  const y = sol - (1 - sortie(k)) * 520;
  c.save(); c.globalAlpha *= 1 - out;
  for (let i = 0; i < 2; i++) {
    const o = prog(t, D0 + 2.9 + i * 0.2, D0 + 3.55 + i * 0.2);
    if (o > 0 && o < 1) {
      c.strokeStyle = `rgba(227,198,140,${0.9 * (1 - o)})`; c.lineWidth = 8 * (1 - o) + 2;
      c.beginPath(); c.ellipse(x, sol, 40 + o * 220, (40 + o * 220) * 0.42, 0, 0, 7); c.stroke();
    }
  }
  c.save(); c.translate(x, y); c.scale(1.5, 1.5);
  c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 24; c.shadowOffsetY = 10;
  c.fillStyle = M.cacao; c.beginPath(); c.arc(0, -78, 46, Math.PI * 0.85, Math.PI * 0.15); c.lineTo(0, 0); c.closePath(); c.fill();
  c.shadowColor = 'transparent';
  c.fillStyle = M.orClair; c.beginPath(); c.arc(0, -80, 19, 0, 7); c.fill();
  c.restore();
  const ke = sortie(prog(t, D0 + 2.85, D0 + 3.2));
  if (ke > 0) {
    c.translate(x, sol + 130 + (1 - ke) * 30); c.globalAlpha *= ke;
    c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 40; c.shadowOffsetY = 12;
    c.fillStyle = M.creme; c.beginPath(); c.roundRect(-320, -78, 640, 176, 30); c.fill();
    c.shadowColor = 'transparent';
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    police(c, 70, 500, 'Bodoni'); c.fillStyle = M.cacao; c.fillText('Maison Fève', 0, 8);
    police(c, 30, 600, 'Instru'); c.fillStyle = M.or; c.letterSpacing = '3px'; c.fillText('CHOCOLATIER · CAROUGE', 0, 64); c.letterSpacing = '0px';
  }
  c.restore();
}

// ---------- 3. le savoir-faire, filmé à l'atelier (7,6 → 12,6 s) ----------
function atelier(c, t) {
  if (t < 7.5 || t > 12.7) return;
  const k = dansSortie(prog(t, 7.5, 7.9));
  c.save();
  c.beginPath(); c.rect(0, H * (1 - k), L, H * k); c.clip();
  if (t < 10.2) cadrer(c, image('tempere', t, 7.5), 0.5, 0.5, mix(1.12, 1.0, prog(t, 7.5, 10.2)));
  else cadrer(c, image('racle', t, 10.1), 0.5, 0.5, mix(1.0, 1.08, prog(t, 10.1, 12.7)));
  if (t > 10.0 && t < 10.3) { c.fillStyle = `rgba(255,255,255,${0.5 * (1 - prog(t, 10.0, 10.3))})`; c.fillRect(0, 0, L, H); }
  voileHaut(c, 760, 0.62);
  c.restore();
  repere(c, t, 7.9, 12.4);
  titre(c, ['Le', 'geste,'], t, 8.0, 330, 116, { fin: 9.95, italiques: [1] });
  sousTitre(c, 'Le chocolat, tempéré à la main', t, 8.4, 430, { fin: 9.95 });
  titre(c, ['le', 'tour', 'de', 'main.'], t, 10.3, 330, 116, { fin: 12.35, italiques: [1, 2, 3] });
  sousTitre(c, 'Chaque coque, raclée d’un geste', t, 10.7, 430, { fin: 12.35 });
}

// ---------- 4. ce que vous offrez : la création finie (12,4 → 15,6 s) ----------
const GAMME = ['Pralinés', 'Truffes', 'Tablettes', 'Coffrets'];
function creations(c, t) {
  if (t < 12.4 || t > 15.8) return;
  const k = sortie(prog(t, 12.4, 12.8));
  c.save(); c.globalAlpha = k;
  cadrer(c, image('tarte', t, 12.4), 0.5, 0.55, mix(1.15, 1.0, k) * mix(1, 1.05, prog(t, 12.8, 15.6)));
  voileHaut(c, 820, 0.6); degrade(c, H - 700, H, 0.7);
  c.restore();
  titre(c, ['Ce', 'que', 'vous', 'offrez,'], t, 12.6, 300, 104, { fin: 15.4 });
  titre(c, ['en', 'grand.'], t, 12.9, 430, 104, { fin: 15.4, italiques: [1] });
  // la gamme, en pastilles crème
  police(c, 40, 600, 'Instru');
  const ws = GAMME.map((m) => c.measureText(m).width + 64), gap = 18;
  const total = ws.reduce((a, b) => a + b, 0) + gap * 3;
  let x = (L - total) / 2;
  GAMME.forEach((m, i) => {
    const kp = rebond(prog(t, 13.5 + i * 0.22, 13.85 + i * 0.22)) * (1 - prog(t, 15.4, 15.6));
    if (kp > 0) {
      c.save(); c.translate(x + ws[i] / 2, 1640); c.scale(kp, kp);
      c.fillStyle = M.creme; c.beginPath(); c.roundRect(-ws[i] / 2, -42, ws[i], 84, 42); c.fill();
      police(c, 40, 600, 'Instru'); c.fillStyle = M.cacao; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(m, 0, 2);
      c.restore();
    }
    x += ws[i] + gap;
  });
}

// ---------- 5. les distinctions, mises en avant (15,4 → 18,8 s) ----------
function medaille(c, x, y, r) {
  // rubans
  c.fillStyle = M.cacao;
  c.beginPath(); c.moveTo(x - r * 0.55, y - r * 0.2); c.lineTo(x - r * 0.95, y + r * 1.55); c.lineTo(x - r * 0.55, y + r * 1.35); c.lineTo(x - r * 0.3, y + r * 1.7); c.lineTo(x, y + r * 0.3); c.fill();
  c.beginPath(); c.moveTo(x + r * 0.55, y - r * 0.2); c.lineTo(x + r * 0.95, y + r * 1.55); c.lineTo(x + r * 0.55, y + r * 1.35); c.lineTo(x + r * 0.3, y + r * 1.7); c.lineTo(x, y + r * 0.3); c.fill();
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, '#F6E3AE'); g.addColorStop(0.55, '#D6AE5E'); g.addColorStop(1, '#9C7432');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r * 0.78, 0, 7); c.stroke();
}
function sceau(c, x, y, r, dessin) {
  c.strokeStyle = M.or; c.lineWidth = 4; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke();
  c.setLineDash([3, 9]); c.beginPath(); c.arc(x, y, r * 0.84, 0, 7); c.stroke(); c.setLineDash([]);
  dessin(c, x, y, r);
}
const DISTINCTIONS = [
  { haut: 'Médaille d’or', bas: 'Concours 2025', dessin: (c, x, y, r) => { medaille(c, x, y - 10, r * 0.62); police(c, 40, 600, 'Bodoni', 'italic'); c.fillStyle = M.cacao; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('1er', x, y - 10); } },
  { haut: 'Fait main', bas: 'à Carouge', dessin: (c, x, y, r) => {
    c.strokeStyle = M.cacao; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round';
    // une main stylisée : paume et quatre doigts
    c.beginPath(); c.roundRect(x - 30, y - 6, 60, 58, 18); c.stroke();
    [-21, -7, 7, 21].forEach((dx, i) => { c.beginPath(); c.moveTo(x + dx, y); c.lineTo(x + dx, y - [36, 48, 46, 34][i]); c.stroke(); });
    c.beginPath(); c.moveTo(x - 30, y + 20); c.lineTo(x - 48, y + 2); c.stroke();
  } },
  { haut: 'Cacao', bas: 'commerce équitable', dessin: (c, x, y, r) => {
    // une fève de cacao
    c.save(); c.translate(x, y); c.rotate(-0.5);
    c.fillStyle = '#7A4A2A'; c.beginPath(); c.ellipse(0, 0, 30, 52, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -46); c.quadraticCurveTo(10, 0, 0, 46); c.stroke();
    c.restore();
  } },
];
function distinctions(c, t) {
  if (t < 15.4 || t > 19.0) return;
  const k = dansSortie(prog(t, 15.4, 15.8));
  const ax = 190, ay = 560, aw = 700, ah = 760;
  // fond crème qui s'ouvre en cercle, puis les truffes dans une arche
  if (k > 0) {
    c.save(); c.beginPath(); c.arc(L / 2, H / 2, k * H * 1.1, 0, 7); c.clip();
    c.fillStyle = M.creme; c.fillRect(0, 0, L, H);
    c.beginPath(); c.roundRect(ax, ay, aw, ah, [350, 350, 28, 28]); c.clip();
    c.translate(ax, ay); cadrer(c, image('truffes', t, 15.4), 0.5, 0.5, mix(1.0, 1.06, prog(t, 15.4, 19)), { l: aw, h: ah });
    c.restore();
  }
  const kOut = prog(t, 18.6, 18.85);
  titre(c, ['Vos', 'distinctions,'], t, 15.7, 290, 96, { fin: 18.6, couleur: M.cacao, italiques: [1], ombre: false });
  titre(c, ['mises', 'en', 'avant.'], t, 15.95, 410, 96, { fin: 18.6, couleur: M.cacao, ombre: false });
  DISTINCTIONS.forEach((d, i) => {
    const kb = rebond(prog(t, 16.4 + i * 0.3, 16.8 + i * 0.3));
    if (kb <= 0 || kOut >= 1) return;
    const x = 200 + i * 340, y = 1530;
    c.save(); c.globalAlpha = 1 - kOut; c.translate(x, y); c.scale(kb, kb); c.translate(-x, -y);
    c.fillStyle = '#fff'; c.shadowColor = 'rgba(42,30,24,0.18)'; c.shadowBlur = 40; c.shadowOffsetY = 12;
    c.beginPath(); c.arc(x, y, 112, 0, 7); c.fill(); c.shadowColor = 'transparent';
    sceau(c, x, y, 112, d.dessin);
    police(c, 36, 600, 'Bodoni', 'italic'); c.fillStyle = M.cacao; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillText(d.haut, x, y + 172);
    police(c, 26, 500, 'Instru'); c.fillStyle = M.brun; c.fillText(d.bas, x, y + 212);
    c.restore();
  });
  if (k > 0.9) {
    c.save(); c.globalAlpha = (1 - kOut) * prog(t, 16.6, 17);
    police(c, 22, 500, 'Instru'); c.fillStyle = 'rgba(42,30,24,0.5)'; c.textAlign = 'center';
    c.fillText('Distinctions d’exemple', L / 2, H - 50);
    c.restore();
  }
}

// ---------- 6. où et quand venir (18,6 → 21,4 s) ----------
function adresse(c, t) {
  if (t < 18.6 || t > 21.6) return;
  const k = dansSortie(prog(t, 18.6, 19.0));
  c.save(); c.beginPath(); c.rect(0, 0, L, H * k); c.clip();
  c.fillStyle = M.cacao; c.fillRect(0, 0, L, H);
  // la carte du quartier, vue du ciel, dans un cadre arrondi
  const cx = 110, cy = 560, cw = 860, ch = 640;
  c.save(); c.beginPath(); c.roundRect(cx, cy, cw, ch, 36); c.clip();
  const z = 18, p = window.CARTE[z], img = MOSAIQUES[z];
  if (img) { const s = mix(1.15, 1.3, prog(t, 18.6, 21.6)); c.translate(cx + cw / 2, cy + ch / 2); c.scale(s, s); c.translate(-p.x, -p.y); c.drawImage(img, 0, 0); }
  c.restore();
  c.fillStyle = 'rgba(42,30,24,0.15)'; c.fillRect(cx, cy, cw, ch);
  // l'épingle
  const kp = rebond(prog(t, 19.1, 19.45));
  if (kp > 0) {
    c.save(); c.translate(L / 2, cy + ch / 2); c.scale(kp * 1.3, kp * 1.3);
    c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
    c.fillStyle = M.creme; c.beginPath(); c.arc(0, -78, 46, Math.PI * 0.85, Math.PI * 0.15); c.lineTo(0, 0); c.closePath(); c.fill();
    c.shadowColor = 'transparent'; c.fillStyle = M.cacao; c.beginPath(); c.arc(0, -80, 19, 0, 7); c.fill();
    c.restore();
  }
  c.restore();
  titre(c, ['Où', 'vous', 'trouver,'], t, 18.8, 290, 100, { fin: 21.25, italiques: [2] });
  titre(c, ['quand', 'venir.'], t, 19.0, 410, 100, { fin: 21.25 });
  // les infos pratiques
  const lignes = [['Maison Fève', 'Carouge, près de la place du Marché'], ['Du mardi au samedi', '9 h – 18 h 30'], ['Click and collect', 'Commandez, passez chercher']];
  lignes.forEach(([a, b], i) => {
    const ki = sortie(prog(t, 19.4 + i * 0.22, 19.75 + i * 0.22)) * (1 - prog(t, 21.25, 21.5));
    if (ki <= 0) return;
    const y = 1310 + i * 130;
    c.save(); c.globalAlpha = ki; c.translate((1 - ki) * 40, 0);
    c.fillStyle = M.or; c.beginPath(); c.arc(150, y - 12, 9, 0, 7); c.fill();
    police(c, 46, 500, 'Bodoni', i === 0 ? 'normal' : 'italic'); c.fillStyle = M.creme; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText(a, 190, y);
    police(c, 30, 500, 'Instru'); c.fillStyle = '#CDBBA8'; c.fillText(b, 190, y + 46);
    c.restore();
  });
}

// ---------- 7. l'appel à l'action (21,2 → 24 s) ----------
const OFFRES = [['Shooting', M.creme, M.cacao], ['Réels', JAUNE, ARDOISE], ['Site', '#5FA85A', '#fff']];
function ligneBrico(c, mots, t, t0, y, taille, { surligne = -1 } = {}) {
  police(c, taille);
  c.textBaseline = 'alphabetic';
  const espace = taille * 0.27;
  const largeurs = mots.map((m, j) => c.measureText(m).width + (j === surligne ? 36 : 0));
  let x = (L - largeurs.reduce((a, b) => a + b, 0) - espace * (mots.length - 1)) / 2;
  mots.forEach((m, j) => {
    const k = sortie(prog(t, t0 + j * 0.06, t0 + j * 0.06 + 0.3));
    if (k > 0) {
      c.save(); c.globalAlpha = k; c.translate(x + largeurs[j] / 2, y + (1 - k) * 26);
      if (j === surligne) {
        const p = sortie(prog(t, t0 + j * 0.06 + 0.1, t0 + j * 0.06 + 0.42));
        c.fillStyle = JAUNE; c.beginPath(); c.roundRect(-largeurs[j] / 2 + 4, -taille * 0.82, (largeurs[j] - 8) * p, taille * 1.04, 12); c.fill();
      }
      c.fillStyle = j === surligne ? ARDOISE : '#fff'; c.textAlign = 'center';
      c.fillText(m, 0, 0);
      c.restore();
    }
    x += largeurs[j] + espace;
  });
}
function appel(c, t) {
  if (t < 21.2) return;
  c.save(); c.globalAlpha = prog(t, 21.2, 21.5); c.drawImage(FOND, 0, 0); c.restore();
  nLumineux(c, 540 - 100, 230, 200, { trace: sortie(prog(t, 21.35, 21.75)), eclat: 0.7 + 0.3 * prog(t, 21.75, 22) });
  ligneBrico(c, ['Votre', 'savoir-faire,'], t, 21.45, 600, 84);
  ligneBrico(c, ['au', 'cœur', 'de', 'vos', 'réseaux.'], t, 21.6, 710, 84, { surligne: 1 });
  police(c, 40, 700, 'Instru');
  const ws = OFFRES.map(([m]) => c.measureText(m).width + 70), gap = 20;
  let x = (L - ws.reduce((a, b) => a + b, 0) - gap * 2) / 2;
  OFFRES.forEach(([m, fond, encre], i) => {
    const k = rebond(prog(t, 21.95 + i * 0.22, 22.3 + i * 0.22));
    if (k > 0) {
      c.save(); c.translate(x + ws[i] / 2, 890); c.scale(k, k);
      c.fillStyle = fond; c.beginPath(); c.roundRect(-ws[i] / 2, -40, ws[i], 80, 40); c.fill();
      police(c, 40, 700, 'Instru'); c.fillStyle = encre; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(m, 0, 2);
      c.restore();
    }
    x += ws[i] + gap;
  });
  const kb = sortie(prog(t, 22.6, 23.0));
  if (kb > 0) {
    const souffle = 1 + Math.sin((t - 23.0) * 6) * 0.03 * prog(t, 23.0, 23.2);
    police(c, 60, 800);
    const texte = 'Réservez un appel';
    const w = c.measureText(texte).width + 230, h = 140;
    c.save(); c.translate(540, 1130 + (1 - kb) * 30); c.scale(souffle, souffle); c.globalAlpha = kb;
    c.shadowColor = 'rgba(255,210,63,0.5)'; c.shadowBlur = 56;
    c.fillStyle = JAUNE; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, h / 2); c.fill();
    c.shadowColor = 'transparent';
    c.fillStyle = ARDOISE; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(texte, -w / 2 + 60, 4);
    const ax = w / 2 - 80 + Math.sin(t * 8) * 4;
    c.strokeStyle = ARDOISE; c.lineWidth = 8; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(ax - 24, 2); c.lineTo(ax + 20, 2); c.moveTo(ax + 2, -18); c.lineTo(ax + 22, 2); c.lineTo(ax + 2, 22); c.stroke();
    c.restore();
  }
  const ks = sortie(prog(t, 22.85, 23.2));
  if (ks > 0) {
    c.save(); c.globalAlpha = ks; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    police(c, 60, 800); c.fillStyle = '#fff'; c.fillText('Nouvelle Ardoise', 540, 1370 + (1 - ks) * 24);
    police(c, 42, 500, 'Instru'); c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillText('Lien en bio · nouvelleardoise.ch', 540, 1440 + (1 - ks) * 24);
    police(c, 22, 500, 'Instru'); c.fillStyle = 'rgba(255,255,255,0.45)';
    c.fillText('Exemple : Maison Fève, chocolatier inventé · Images : Pexels, swisstopo', 540, H - 40);
    c.restore();
  }
}

window.pret = Promise.all([
  document.fonts.load('800 100px Brico'), document.fonts.load('500 40px Instru'), document.fonts.load('600 40px Instru'), document.fonts.load('700 40px Instru'),
  document.fonts.load('500 100px Bodoni'), document.fonts.load('italic 500 100px Bodoni'), document.fonts.load('italic 600 40px Bodoni'),
  ...NIVEAUX.map((z) => charger(`carte-carouge/z${z}.jpg`).then((i) => { MOSAIQUES[z] = i; })),
  ...Object.keys(IMAGES).flatMap((plan) => Array.from({ length: window.VIDEOS[plan] }, (_, i) =>
    charger(`videos/images-artisan/${plan}/${String(i + 1).padStart(3, '0')}.jpg`).then((im) => { IMAGES[plan][i] = im; }))),
]);

window.rendu = function (t) {
  ctx.drawImage(FOND, 0, 0);
  accroche(ctx, t);
  aerien(ctx, t);
  atelier(ctx, t);
  creations(ctx, t);
  distinctions(ctx, t);
  adresse(ctx, t);
  appel(ctx, t);
};

if (!navigator.webdriver) {
  window.pret.then(() => {
    const debut = performance.now();
    const boucle = () => { window.rendu(((performance.now() - debut) / 1000) % DUREE); requestAnimationFrame(boucle); };
    boucle();
  });
}
