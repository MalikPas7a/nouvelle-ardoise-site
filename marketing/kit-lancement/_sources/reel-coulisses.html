<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réel « coulisses » : ce que sont nos 4 réels par mois</title>
<!--
  Réel Instagram 20 s, 1080×1920, monté en motion design sur un tempo de 120 BPM (un temps = 0,5 s).
  Il montre le niveau de montage des réels livrés chaque mois, avec l'exemple de Maison Fève
  (chocolatier inventé, charte de la page Artisans : crème, cacao, Bodoni Moda) :
  1. 0 → 2 s   : « 06:00, l'atelier ouvre » : horodatage qui défile sur le chocolat coulé.
  2. 2 → 4,5 s : écran partagé en trois bandes : tempérer, mouler, racler.
  3. 4,5 → 7 s : ouverture en cercle sur le glaçage miroir, jauge « 35 °C ».
  4. 7 → 10 s  : coupes au rythme, un mot frappé par plan : Précis. Patient. Fait main. Chaque jour.
  5. 10 → 13 s : traversée vers la pièce finie, carte produit qui se dessine.
  6. 13 → 17 s : « Vos 4 réels du mois » : quatre téléphones, une idée par semaine.
  7. 17 → 20 s : l'appel à l'action Nouvelle Ardoise.
  sh videos/extraire-artisan.sh <vidéos Pexels> puis REEL=reel-coulisses node render.mjs assemblent la vidéo.
-->
<style>
  @font-face { font-family: Brico; src: url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: Instru; src: url(fonts/instrument-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-standard-normal.woff2) format('woff2'); font-weight: 400 900; }
  @font-face { font-family: Bodoni; src: url(fonts/bodoni-moda-latin-standard-italic.woff2) format('woff2'); font-weight: 400 900; font-style: italic; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas width="1080" height="1920"></canvas>
<script src="ardoise.js"></script>
<script src="videos/images-artisan/index.js"></script>
<script>
const L = 1080, H = 1920, DUREE = 20, B = 0.5;
window.DUREE = DUREE;
const JAUNE = '#FFD23F', ARDOISE = '#1E2A2C';
const M = { creme: '#F6F0E7', cacao: '#2A1E18', brun: '#6B5A4C', or: '#B08A4E', orClair: '#E3C68C' };
const ctx = document.querySelector('canvas').getContext('2d');
const FOND = peindreArdoise(L, H);
const toile = (l, h) => Object.assign(document.createElement('canvas'), { width: l, height: h });

// ---------- outils ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const sortie = (k) => 1 - Math.pow(1 - k, 3);
const entree = (k) => k * k * k;
const dansSortie = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const rebond = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const police = (c, taille, graisse = 800, famille = 'Brico', style = 'normal') => { c.font = `${style} ${graisse} ${taille}px ${famille}`; };
const charger = (src) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
const IMAGES = Object.fromEntries(Object.keys(window.VIDEOS).map((k) => [k, []]));
// vitesse : 1 = temps réel, < 1 = ralenti (rampes de vitesse)
const image = (plan, t, t0, vitesse = 1) => { const l = IMAGES[plan]; return l[clamp(Math.floor((t - t0) * 30 * vitesse), 0, l.length - 1)]; };

function cadrer(c, img, fx, fy, z = 1, { flou = 0, alpha = 1, l = L, h = H } = {}) {
  const s = Math.max(l / img.width, h / img.height) * z;
  const w = img.width * s, hh = img.height * s;
  const x = clamp(l / 2 - fx * w, l - w, 0), y = clamp(h / 2 - fy * hh, h - hh, 0);
  c.save(); c.globalAlpha *= alpha;
  if (flou > 0.2) c.filter = `blur(${flou}px)`;
  c.drawImage(img, x, y, w, hh);
  c.restore();
}
function voileHaut(c, h, force) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, `rgba(20,14,10,${force})`); g.addColorStop(1, 'rgba(20,14,10,0)');
  c.fillStyle = g; c.fillRect(0, 0, L, h);
}
function voileBas(c, h, force) {
  const g = c.createLinearGradient(0, H - h, 0, H);
  g.addColorStop(0, 'rgba(20,14,10,0)'); g.addColorStop(1, `rgba(20,14,10,${force})`);
  c.fillStyle = g; c.fillRect(0, H - h, L, h);
}
// grain de pellicule léger, pour l'unité du montage
const GRAIN = (() => { const n = toile(256, 256), c = n.getContext('2d'), d = c.createImageData(256, 256), r = hasard(5);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; }
  c.putImageData(d, 0, 0); return n; })();
function grain(c, t) {
  const o = Math.floor(t * 24) % 4;
  c.save(); c.globalCompositeOperation = 'overlay';
  for (let y = -o * 40; y < H; y += 256) for (let x = -o * 30; x < L; x += 256) c.drawImage(GRAIN, x, y);
  c.restore();
}
function titre(c, mots, t, t0, y, taille, { fin = 1e9, couleur = '#fff', italiques = [], ombre = true, ecart = 0.06, aligne = 'center', x0 = 80 } = {}) {
  c.textBaseline = 'alphabetic';
  const style = (j) => (italiques.includes(j) ? 'italic' : 'normal');
  const largeurs = mots.map((m, j) => { police(c, taille, 500, 'Bodoni', style(j)); return c.measureText(m).width; });
  const espace = taille * 0.26;
  let x = aligne === 'center' ? (L - largeurs.reduce((a, b) => a + b, 0) - espace * (mots.length - 1)) / 2 : x0;
  const kOut = prog(t, fin, fin + 0.2);
  mots.forEach((m, j) => {
    const k = sortie(prog(t, t0 + j * ecart, t0 + j * ecart + 0.35));
    if (k > 0 && kOut < 1) {
      c.save(); c.globalAlpha = k * (1 - kOut);
      c.translate(x, y + (1 - k) * 34 - kOut * 24);
      police(c, taille, 500, 'Bodoni', style(j)); c.textAlign = 'left';
      c.fillStyle = italiques.includes(j) ? (couleur === '#fff' ? M.orClair : M.or) : couleur;
      if (ombre) { c.shadowColor = 'rgba(0,0,0,0.55)'; c.shadowBlur = 30; c.shadowOffsetY = 4; }
      c.fillText(m, 0, 0); c.restore();
    }
    x += largeurs[j] + espace;
  });
}
function etiquette(c, texte, x, y, k, { fond = M.creme, encre = M.cacao, taille = 30 } = {}) {
  if (k <= 0) return;
  police(c, taille, 700, 'Instru'); c.letterSpacing = '4px';
  const w = c.measureText(texte).width + 56;
  c.save(); c.globalAlpha = Math.min(1, k); c.translate(x, y); c.scale(k, k);
  c.fillStyle = fond; c.beginPath(); c.roundRect(-w / 2, -32, w, 64, 32); c.fill();
  c.fillStyle = encre; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(texte, 0, 2);
  c.restore(); c.letterSpacing = '0px';
}

// ---------- 1. 06:00, l'atelier ouvre (0 → 2,1 s) ----------
function ouverture(c, t) {
  if (t > 2.2) return;
  // rampe de vitesse : rapide puis ralenti
  const f = t < 0.8 ? t * 1.6 : 1.28 + (t - 0.8) * 0.55;
  cadrer(c, image('coulee', f, 0), 0.5, 0.55, mix(1.18, 1.0, sortie(prog(t, 0, 0.8))));
  voileHaut(c, 900, 0.7);
  // l'horodatage défile de 05:52 à 06:00
  const minutes = Math.round(mix(52, 60, sortie(prog(t, 0.1, 0.9))));
  const heure = minutes >= 60 ? '06:00' : `05:${String(minutes).padStart(2, '0')}`;
  const k = sortie(prog(t, 0.05, 0.3)) * (1 - prog(t, 1.95, 2.1));
  if (k > 0) {
    c.save(); c.globalAlpha = k;
    police(c, 230, 400, 'Bodoni'); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 40;
    c.fillText(heure, L / 2, 470);
    c.restore();
  }
  titre(c, ['L’atelier', 'ouvre.'], t, 0.9, 600, 84, { fin: 1.95, italiques: [1] });
  // flash blanc sur le temps fort
  if (t > 1.95) { c.fillStyle = `rgba(255,248,236,${prog(t, 1.95, 2.05) * (1 - prog(t, 2.05, 2.2))})`; c.fillRect(0, 0, L, H); }
}

// ---------- 2. trois bandes : tempérer, mouler, racler (2 → 4,6 s) ----------
const BANDES = [['tempere', 'TEMPÉRER'], ['coulee', 'MOULER'], ['racle', 'RACLER']];
function bandes(c, t) {
  if (t < 1.9 || t > 4.7) return;
  if (t > 2.15) { c.fillStyle = M.cacao; c.fillRect(0, 0, L, H); }
  const w = L / 3;
  BANDES.forEach(([plan, mot], i) => {
    const k = dansSortie(prog(t, 1.9 + i * B / 3, 1.9 + i * B / 3 + 0.35));
    const out = dansSortie(prog(t, 4.3 + i * 0.05, 4.65));
    if (k <= 0) return;
    c.save();
    const y = (i % 2 ? -1 : 1) * (1 - k) * H + (i % 2 ? 1 : -1) * out * H;
    c.beginPath(); c.rect(i * w + 4, y, w - 8, H); c.clip();
    c.translate(i * w, y);
    cadrer(c, image(plan, t, 2.0 + i * 0.3), 0.5, 0.5, 1.05, { l: w, h: H });
    c.restore();
    etiquette(c, mot, i * w + w / 2, 1640 + y, rebond(prog(t, 2.6 + i * B / 2, 2.95 + i * B / 2)), { taille: 26 });
  });
  titre(c, ['Trois', 'gestes,'], t, 2.3, 260, 96, { fin: 4.25 });
  titre(c, ['une', 'seule', 'coque.'], t, 2.5, 380, 96, { fin: 4.25, italiques: [2] });
}

// ---------- 3. le glaçage miroir, jauge de température (4,5 → 7 s) ----------
function glacage(c, t) {
  if (t < 4.45 || t > 7.1) return;
  const k = dansSortie(prog(t, 4.45, 4.95));
  c.save();
  c.beginPath(); c.arc(L / 2, H * 0.55, k * H, 0, 7); c.clip();
  cadrer(c, image('glacage', t, 4.45, 0.75), 0.5, 0.55, mix(1.25, 1.02, sortie(prog(t, 4.45, 6.0))));
  voileHaut(c, 760, 0.62); voileBas(c, 520, 0.6);
  c.restore();
  titre(c, ['Le', 'glaçage', 'miroir.'], t, 4.8, 300, 104, { fin: 6.85, italiques: [1, 2] });
  // jauge : la température monte jusqu'à 35 °C
  const kg = sortie(prog(t, 5.1, 5.5)) * (1 - prog(t, 6.85, 7.05));
  if (kg > 0) {
    const temp = Math.round(mix(22, 35, sortie(prog(t, 5.2, 6.2))));
    c.save(); c.globalAlpha = kg;
    const cx = L / 2, cy = 1560, r = 120;
    c.fillStyle = 'rgba(20,14,10,0.55)'; c.beginPath(); c.arc(cx, cy + 10, r + 70, 0, 7); c.fill();
    c.lineCap = 'round'; c.lineWidth = 16;
    c.strokeStyle = 'rgba(255,255,255,0.22)'; c.beginPath(); c.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25); c.stroke();
    c.strokeStyle = M.orClair; c.beginPath(); c.arc(cx, cy, r, Math.PI * 0.75, Math.PI * (0.75 + 1.5 * prog(temp, 22, 35))); c.stroke();
    police(c, 76, 500, 'Bodoni'); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`${temp} °C`, cx, cy - 4);
    police(c, 24, 700, 'Instru'); c.letterSpacing = '4px'; c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillText('AU DEGRÉ PRÈS', cx, cy + 88); c.letterSpacing = '0px';
    c.restore();
  }
}

// ---------- 4. coupes au rythme, un mot par plan (7 → 10 s) ----------
const COUPES = [['fraises', 'Précis.'], ['pain', 'Patient.'], ['truffes', 'Fait main.'], ['tempere', 'Chaque jour.']];
function coupes(c, t) {
  if (t < 7.0 || t > 10.05) return;
  const i = clamp(Math.floor((t - 7.0) / (B * 1.5)), 0, 3);
  const t0 = 7.0 + i * B * 1.5;
  const [plan, mot] = COUPES[i];
  const punch = 1 + 0.08 * (1 - sortie(prog(t, t0, t0 + 0.25)));
  cadrer(c, image(plan, t, t0 - 0.2), 0.5, 0.5, punch);
  voileBas(c, 900, 0.75);
  // le mot frappé, avec une petite secousse
  const k = rebond(prog(t, t0 + 0.04, t0 + 0.3));
  const secousse = (1 - prog(t, t0, t0 + 0.2)) * 10;
  c.save(); c.translate(L / 2 + Math.sin(t * 90) * secousse, 1560); c.scale(k, k);
  police(c, 150, 500, 'Bodoni', 'italic'); c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = 40; c.fillText(mot, 0, 0);
  c.restore();
  // repères de progression : quatre traits en haut
  for (let j = 0; j < 4; j++) {
    c.fillStyle = j <= i ? M.orClair : 'rgba(255,255,255,0.3)';
    c.fillRect(80 + j * 236, 120, 220, 6);
  }
  if (t - t0 < 0.08) { c.fillStyle = 'rgba(255,248,236,0.5)'; c.fillRect(0, 0, L, H); }
}

// ---------- 5. traversée vers la pièce finie, carte produit (10 → 13,2 s) ----------
function piece(c, t) {
  if (t < 10.0 || t > 13.3) return;
  const z = mix(2.2, 1.0, dansSortie(prog(t, 10.0, 10.7)));
  cadrer(c, image('tarte', t, 10.0, 0.6), 0.35, 0.55, z * mix(1, 1.06, prog(t, 10.7, 13.2)), { flou: mix(18, 0, prog(t, 10.0, 10.6)) });
  voileHaut(c, 760, 0.55);
  // reflet de lumière qui traverse
  const kl = prog(t, 10.3, 11.3);
  if (kl > 0 && kl < 1) {
    const x = mix(-400, L + 400, kl);
    const g = c.createLinearGradient(x - 260, 0, x + 260, 0);
    g.addColorStop(0, 'rgba(255,220,170,0)'); g.addColorStop(0.5, 'rgba(255,220,170,0.28)'); g.addColorStop(1, 'rgba(255,220,170,0)');
    c.save(); c.globalCompositeOperation = 'screen'; c.fillStyle = g; c.fillRect(0, 0, L, H); c.restore();
  }
  titre(c, ['Puis', 'la', 'pièce', 'finie.'], t, 10.6, 300, 100, { fin: 13.0, italiques: [2, 3] });
  // la carte produit se dessine
  const kc = sortie(prog(t, 11.2, 11.6)) * (1 - prog(t, 13.0, 13.2));
  if (kc > 0) {
    c.save(); c.globalAlpha = kc; c.translate(0, (1 - kc) * 60);
    c.fillStyle = 'rgba(246,240,231,0.96)'; c.beginPath(); c.roundRect(110, 1440, 860, 280, 28); c.fill();
    police(c, 24, 700, 'Instru'); c.letterSpacing = '5px'; c.fillStyle = M.or; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillText('LA CRÉATION DU MOIS', 160, 1510); c.letterSpacing = '0px';
    police(c, 64, 500, 'Bodoni', 'italic'); c.fillStyle = M.cacao; c.fillText('Tarte chocolat framboise', 160, 1600);
    police(c, 30, 500, 'Instru'); c.fillStyle = M.brun; c.fillText('Sablé cacao, ganache, framboises du jour', 160, 1660);
    // trait doré qui se trace
    c.fillStyle = M.or; c.fillRect(160, 1530, 120 * sortie(prog(t, 11.5, 11.9)), 3);
    c.restore();
  }
}

// ---------- 6. vos 4 réels du mois (13 → 17,2 s) ----------
const MOIS = [['coulee', 'Semaine 1', 'Les coulisses'], ['tarte', 'Semaine 2', 'La création du mois'], ['pain', 'Semaine 3', 'L’équipe'], ['fraises', 'Semaine 4', 'La saison']];
function telephone(c, plan, t, t0, x, y, w, k, [_, semaine, idee], i) {
  const h = w * 16 / 9;
  c.save(); c.translate(x, y); c.scale(k, k); c.rotate((i % 2 ? 1 : -1) * 0.02 * (1 - k));
  c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 50; c.shadowOffsetY = 18;
  c.fillStyle = '#120d0a'; c.beginPath(); c.roundRect(-w / 2 - 10, -h / 2 - 10, w + 20, h + 20, 40); c.fill();
  c.shadowColor = 'transparent';
  c.save(); c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 32); c.clip();
  c.translate(-w / 2, -h / 2); cadrer(c, image(plan, t, t0), 0.5, 0.5, 1, { l: w, h });
  const g = c.createLinearGradient(0, h * 0.55, 0, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)');
  c.fillStyle = g; c.fillRect(0, h * 0.55, w, h * 0.45);
  police(c, 18, 700, 'Instru'); c.fillStyle = '#fff'; c.textAlign = 'left'; c.fillText('Réels', 18, 38);
  police(c, 30, 500, 'Bodoni', 'italic'); c.fillStyle = '#fff'; c.fillText(idee, 18, h - 40);
  c.restore();
  c.restore();
  // la semaine, au-dessus
  police(c, 22, 700, 'Instru'); c.letterSpacing = '4px'; c.fillStyle = M.or; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.save(); c.globalAlpha = Math.min(1, k); c.fillText(semaine.toUpperCase(), x, y - h / 2 * k - 28); c.restore(); c.letterSpacing = '0px';
}
function mois(c, t) {
  if (t < 13.0 || t > 17.3) return;
  const k = dansSortie(prog(t, 13.0, 13.4));
  c.save(); c.beginPath(); c.rect(0, H * (1 - k), L, H * k); c.clip();
  c.fillStyle = M.creme; c.fillRect(0, 0, L, H);
  c.restore();
  if (k < 0.6) return;
  titre(c, ['Vos', 'quatre', 'réels'], t, 13.3, 250, 110, { fin: 17.0, couleur: M.cacao, ombre: false, italiques: [1] });
  titre(c, ['du', 'mois.'], t, 13.45, 375, 110, { fin: 17.0, couleur: M.cacao, ombre: false, italiques: [1] });
  const w = 380, pos = [[290, 820], [790, 820], [290, 1500], [790, 1500]];
  MOIS.forEach((m, i) => {
    const kp = rebond(prog(t, 13.7 + i * B / 2, 14.1 + i * B / 2)) * (1 - dansSortie(prog(t, 16.95, 17.25)));
    if (kp > 0) telephone(c, m[0], t, 13.7 + i * 0.25, pos[i][0], pos[i][1] - 40, w * 0.8, kp, m, i);
  });
  const kn = sortie(prog(t, 15.2, 15.6)) * (1 - prog(t, 16.9, 17.1));
  if (kn > 0) {
    c.save(); c.globalAlpha = kn;
    police(c, 30, 500, 'Instru'); c.fillStyle = M.brun; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillText('Tournés chez vous, montés et publiés par nous.', L / 2, H - 70);
    c.restore();
  }
}

// ---------- 7. l'appel à l'action (17 → 20 s) ----------
function ligneBrico(c, mots, t, t0, y, taille, { surligne = -1 } = {}) {
  police(c, taille); c.textBaseline = 'alphabetic';
  const espace = taille * 0.27;
  const largeurs = mots.map((m, j) => c.measureText(m).width + (j === surligne ? 36 : 0));
  let x = (L - largeurs.reduce((a, b) => a + b, 0) - espace * (mots.length - 1)) / 2;
  mots.forEach((m, j) => {
    const k = sortie(prog(t, t0 + j * 0.06, t0 + j * 0.06 + 0.3));
    if (k > 0) {
      c.save(); c.globalAlpha = k; c.translate(x + largeurs[j] / 2, y + (1 - k) * 26);
      if (j === surligne) {
        const p = sortie(prog(t, t0 + j * 0.06 + 0.1, t0 + j * 0.06 + 0.42));
        c.fillStyle = JAUNE; c.beginPath(); c.roundRect(-largeurs[j] / 2 + 4, -taille * 0.82, (largeurs[j] - 8) * p, taille * 1.04, 12); c.fill();
      }
      c.fillStyle = j === surligne ? ARDOISE : '#fff'; c.textAlign = 'center'; c.fillText(m, 0, 0);
      c.restore();
    }
    x += largeurs[j] + espace;
  });
}
function appel(c, t) {
  if (t < 17.0) return;
  c.save(); c.globalAlpha = prog(t, 17.0, 17.3); c.drawImage(FOND, 0, 0); c.restore();
  nLumineux(c, 540 - 100, 230, 200, { trace: sortie(prog(t, 17.15, 17.55)), eclat: 0.7 + 0.3 * prog(t, 17.55, 17.8) });
  ligneBrico(c, ['4', 'réels', 'par', 'mois,'], t, 17.25, 600, 92, { surligne: 1 });
  ligneBrico(c, ['tournés', 'chez', 'vous.'], t, 17.4, 715, 92);
  const kb = sortie(prog(t, 18.0, 18.4));
  if (kb > 0) {
    const souffle = 1 + Math.sin((t - 18.4) * 6) * 0.03 * prog(t, 18.4, 18.6);
    police(c, 60, 800);
    const texte = 'Réservez un appel';
    const w = c.measureText(texte).width + 230, h = 140;
    c.save(); c.translate(540, 990 + (1 - kb) * 30); c.scale(souffle, souffle); c.globalAlpha = kb;
    c.shadowColor = 'rgba(255,210,63,0.5)'; c.shadowBlur = 56;
    c.fillStyle = JAUNE; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, h / 2); c.fill();
    c.shadowColor = 'transparent';
    c.fillStyle = ARDOISE; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(texte, -w / 2 + 60, 4);
    const ax = w / 2 - 80 + Math.sin(t * 8) * 4;
    c.strokeStyle = ARDOISE; c.lineWidth = 8; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(ax - 24, 2); c.lineTo(ax + 20, 2); c.moveTo(ax + 2, -18); c.lineTo(ax + 22, 2); c.lineTo(ax + 2, 22); c.stroke();
    c.restore();
  }
  const ks = sortie(prog(t, 18.25, 18.6));
  if (ks > 0) {
    c.save(); c.globalAlpha = ks; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    police(c, 60, 800); c.fillStyle = '#fff'; c.fillText('Nouvelle Ardoise', 540, 1230 + (1 - ks) * 24);
    police(c, 42, 500, 'Instru'); c.fillStyle = 'rgba(255,255,255,0.75)'; c.fillText('Lien en bio · nouvelleardoise.ch', 540, 1300 + (1 - ks) * 24);
    police(c, 22, 500, 'Instru'); c.fillStyle = 'rgba(255,255,255,0.45)';
    c.fillText('Exemple : Maison Fève, chocolatier inventé · Images : Pexels', 540, H - 40);
    c.restore();
  }
}

window.pret = Promise.all([
  document.fonts.load('800 100px Brico'), document.fonts.load('500 40px Instru'), document.fonts.load('700 40px Instru'),
  document.fonts.load('400 100px Bodoni'), document.fonts.load('500 100px Bodoni'), document.fonts.load('italic 500 100px Bodoni'),
  ...Object.keys(IMAGES).flatMap((plan) => Array.from({ length: window.VIDEOS[plan] }, (_, i) =>
    charger(`videos/images-artisan/${plan}/${String(i + 1).padStart(3, '0')}.jpg`).then((im) => { IMAGES[plan][i] = im; }))),
]);

window.rendu = function (t) {
  ctx.fillStyle = M.cacao; ctx.fillRect(0, 0, L, H);
  ouverture(ctx, t);
  bandes(ctx, t);
  glacage(ctx, t);
  coupes(ctx, t);
  piece(ctx, t);
  mois(ctx, t);
  appel(ctx, t);
  grain(ctx, t);
};

if (!navigator.webdriver) {
  window.pret.then(() => {
    const debut = performance.now();
    const boucle = () => { window.rendu(((performance.now() - debut) / 1000) % DUREE); requestAnimationFrame(boucle); };
    boucle();
  });
}
