<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Publication et avatar</title>
<!--
  Publication Instagram 4:5 (1080×1350) et photo de profil (1080×1080), sur l'ardoise,
  dans le style de la carte de visite. ?quoi=avatar affiche la photo de profil.
  Exportées en PNG par publication.mjs.
-->
<style>
  @font-face { font-family: Brico; src: url(fonts/bricolage-grotesque-latin-standard-normal.woff2) format('woff2'); font-weight: 200 800; }
  @font-face { font-family: Instru; src: url(fonts/instrument-sans-latin-wght-normal.woff2) format('woff2'); font-weight: 400 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas></canvas>
<script src="ardoise.js"></script>
<script>
const toile = document.querySelector('canvas');
const ctx = toile.getContext('2d');
const avatar = new URLSearchParams(location.search).get('quoi') === 'avatar';

const sushi = new Image();
sushi.src = '../../../public/sequences/sushi/x/096.webp';

window.pret = Promise.all([
  new Promise((ok) => (sushi.complete ? ok() : (sushi.onload = ok))),
  document.fonts.load('800 100px Brico'), document.fonts.load('500 30px Instru'),
]).then(() => (avatar ? dessinerAvatar() : dessinerPublication()));

function dessinerAvatar() {
  toile.width = toile.height = 1080;
  ctx.drawImage(peindreArdoise(1080, 1080, 8), 0, 0);
  // le N tient dans le rond de la photo de profil
  nLumineux(ctx, 540 - 230, 540 - 197, 460);
}

function dessinerPublication() {
  const L = 1080, H = 1350;
  toile.width = L; toile.height = H;
  ctx.drawImage(peindreArdoise(L, H, 4), 0, 0);
  // le maki éclaté, posé sur l'ardoise (le noir de la photo disparaît)
  ctx.save();
  ctx.globalCompositeOperation = 'lighten';
  const w = 1180, h = w * 1440 / 2560;
  ctx.drawImage(sushi, L / 2 - w * 0.49, 915 - h * 0.47, w, h);
  ctx.restore();

  traitJaune(ctx, 80, 112, 120);
  nLumineux(ctx, 812, 82, 190);

  const pol = '800 104px Brico';
  ctx.fillStyle = '#fff'; ctx.font = pol; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 24;
  ctx.fillText('Passez l’éponge', 80, 350);
  ctx.fillText('sur votre', 80, 460);
  ctx.shadowColor = 'transparent';
  // « ancien menu. » déjà essuyé : il n'en reste qu'une traînée
  texteEfface(ctx, 'ancien menu.', 80, 570, 2000, { police: pol });

  // pied : la signature et le site
  ctx.fillStyle = '#fff'; ctx.font = '800 54px Brico';
  ctx.fillText('Nouvelle Ardoise', 80, 1218);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '500 30px Instru';
  ctx.fillText('Sites et menus 3D · Genève & Vaud', 80, 1268);
  ctx.font = '800 34px Brico';
  const lien = 'nouvelleardoise.ch', lw = ctx.measureText(lien).width + 64;
  ctx.fillStyle = ARD.jaune; ctx.beginPath(); ctx.roundRect(L - 80 - lw, 1196, lw, 84, 42); ctx.fill();
  ctx.fillStyle = ARD.ardoise; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lien, L - 80 - lw / 2, 1240);
}
</script>
</body>
</html>
