<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Karvan · Espace pro</title>
<meta name="description" content="Démo : espace de commande pour les professionnels et tableau de gestion de Karvan.">
<meta name="theme-color" content="#1B2440">
<link rel="icon" href="../img/karvan-icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --papier:#F3EEE4; --papier-2:#EBE4D6; --lapis:#1B2440; --safran:#C8902E; --safran-texte:#8E6216; --kraft:#B98A55; --blanc:#FFFFFF;
  --encre-2:#4A5068; --filet:#D9D1C1; --bord-champ:#8C8577; --vert:#2F6B45; --vert-fond:#DCEBDD; --rouge:#A33A2A; --rouge-fond:#F6DCD6; --ambre-fond:#F8E8C8;
  --f:"Outfit","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --g:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--papier);color:var(--lapis);font:400 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font:500 11.5px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.015em;line-height:1.1}
h1{font-size:clamp(28px,4vw,40px)}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
.calme{color:var(--encre-2)}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.barre :focus-visible,.flotte :focus-visible,.barre-fac :focus-visible{outline-color:var(--safran)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--lapis);background:transparent;font-weight:500;font-size:15px;transition:background .15s,color .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--lapis);color:var(--papier)}
.btn.plein{background:var(--lapis);color:var(--papier)}
.btn.plein:hover{background:#2B3658}
.btn.saf{background:var(--safran);border-color:var(--safran);color:var(--lapis)}
.btn.saf:hover{background:#B57F22}
.btn.petit{min-height:36px;padding:0 12px;font-size:14px}
@media (pointer:coarse){.btn.petit{min-height:44px}}
#reinit{padding:6px 4px;min-height:32px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lien{border:0;padding:0;min-height:auto;text-decoration:underline;text-underline-offset:3px}
.btn.lien:hover{background:none;color:var(--safran-texte)}

/* bandeau démo + barre */
.demo{background:var(--safran);color:var(--lapis);text-align:center;padding:7px var(--g);font-size:13.5px}
.demo b{font-weight:600}
.barre{position:sticky;top:0;z-index:30;background:var(--lapis);color:var(--papier)}
.barre .in{max-width:1240px;margin:0 auto;padding:0 var(--g);height:64px;display:flex;align-items:center;gap:20px}
.barre .logo img{height:44px;width:auto}
.bascule{margin-left:auto;display:flex;border:1px solid #3A4466}
.bascule button{background:none;border:0;color:#C9CDDA;padding:8px 14px;font-size:14px;min-height:40px}
.bascule button[aria-pressed="true"]{background:var(--papier);color:var(--lapis);font-weight:500}
.qui{font-size:13.5px;color:#C9CDDA;text-align:right;line-height:1.25}
.qui b{color:var(--papier);font-weight:500;display:block}
.deco{background:none;border:1px solid #3A4466;color:#C9CDDA;padding:8px 12px;font-size:13.5px;min-height:40px}
body.login .bascule,body.login .qui,body.login .deco,body.login .onglets{display:none}
.cnx{max-width:980px;margin:0 auto;padding:48px var(--g) 64px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start}
.cnx h1{font-size:clamp(30px,4.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:0 0 14px;font-weight:600;color:var(--lapis)}
.cnx .chap{color:var(--encre-2);font-size:16.5px;line-height:1.5;margin:0 0 22px;max-width:44ch}
.cnx ul.plus{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:10px}
.cnx ul.plus li{padding-left:22px;position:relative;font-size:15px}
.cnx ul.plus li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;background:var(--safran)}
.cnx .carte{background:var(--blanc);border:1px solid var(--filet);padding:26px}
.cnx .carte h2{margin:0 0 16px;font-size:20px;color:var(--lapis)}.cnx .carte h2 .m{display:none}
.cnx label{display:grid;gap:6px;font-size:14px;margin-bottom:14px}
.cnx input{font:inherit;font-size:16px;padding:12px;border:1px solid var(--bord-champ);background:var(--papier);min-height:46px}
.cnx .err{color:var(--rouge);font-size:14px;margin:-6px 0 12px}
.cnx .ou{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-2);margin:22px 0 10px}
.cnx .comptes{display:grid;gap:10px}
.cnx .compte{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--papier);border:1px solid var(--filet);padding:14px 16px;min-height:56px;font:inherit;color:var(--lapis);cursor:pointer}
.cnx .compte:hover{border-color:var(--lapis)}
.cnx .compte small{display:block;color:var(--encre-2);font-size:13px}
.cnx .compte span.f{font-size:20px}
.cnx .pied{font-size:14px;color:var(--encre-2);margin:18px 0 0}
.cnx .pied a{color:var(--lapis)}
@media (max-width:760px){.bascule{display:none}.deco{white-space:nowrap}.cnx{grid-template-columns:1fr;gap:26px;padding-top:30px}.cnx .carte{order:-1}.cnx h1{display:none}.cnx .carte h2 .m{display:inline}.deco{margin-left:auto}}
@media (max-width:760px){.qui{display:none}.barre .logo img{height:38px}.bascule button{padding:8px 10px}}

/* onglets */
.onglets{background:var(--papier);border-bottom:1px solid var(--filet);position:sticky;top:64px;z-index:20}
.onglets .in{max-width:1240px;margin:0 auto;padding:0 var(--g);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.onglets .in::-webkit-scrollbar{display:none}
.onglets button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 12px 12px;font-size:15px;white-space:nowrap;color:var(--encre-2)}
.onglets button[aria-selected="true"]{color:var(--lapis);border-bottom-color:var(--safran);font-weight:500}
.pastille{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;background:var(--safran);color:var(--lapis);font:500 12px/1 var(--mono);border-radius:10px}
.pastille.rouge{background:var(--rouge);color:#fff}

main{max-width:1240px;margin:0 auto;padding:28px var(--g) 120px}
.tete{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}
.tete p{max-width:62ch}
.carte{background:var(--blanc);border:1px solid var(--filet)}
.sect{margin-top:36px}
.sect>h2{margin-bottom:14px}

/* catalogue */
.outils{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:18px}
.rapide{display:flex;gap:8px;background:var(--blanc);border:1px solid var(--bord-champ);padding:8px}
.rapide input{flex:1;min-width:0;border:0;background:none;padding:6px 8px;font-family:var(--mono);font-size:16px;text-transform:uppercase}
.rapide:focus-within{outline:2px solid var(--lapis);outline-offset:2px}
.rapide input::placeholder{text-transform:none;font-family:var(--f);color:#8A8FA3}
.rapide input:focus{outline:none}
.filtres{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.filtres button{border:1px solid var(--filet);background:var(--blanc);padding:7px 14px;font-size:14px;white-space:nowrap;min-height:44px}
.filtres button[aria-pressed="true"]{background:var(--lapis);color:var(--papier);border-color:var(--lapis)}
@media (max-width:700px){.outils{grid-template-columns:1fr}}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
@media (max-width:560px){.grille{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.prod .bas{flex-wrap:wrap;gap:6px}.prod .corps{padding:10px 10px 12px;gap:4px}.prod h3{font-size:15px}.prod .det{font-size:12.5px}.prod .prix b{font-size:16px}.prod .prix{flex-wrap:wrap;gap:2px 6px}.prod .prix span{font-size:12px}.qte button{width:40px}.qte input{width:36px}.dispo{font-size:12px}.tete .btn{white-space:normal;text-align:center;width:100%;padding:10px 14px}}
.prod{display:flex;flex-direction:column;min-width:0;background:var(--blanc);border:1px solid var(--filet)}
.prod .vis{aspect-ratio:4/3;background:#EFE8DA;display:grid;place-items:center;overflow:hidden}
.prod .vis img{width:78%;height:auto;mix-blend-mode:multiply}
.prod .corps{padding:14px 14px 16px;display:grid;gap:6px;flex:1}
.prod .ref{color:var(--safran-texte)}
.prod h3{font-size:16px;line-height:1.25}
.prod .det{font-size:13.5px;color:var(--encre-2)}
.prod .prix{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.prod .prix b{font:500 19px/1 var(--mono)}
.prod .prix span{font-size:13px;color:var(--encre-2)}
.prod .pp{font-size:12.5px;color:var(--encre-2)}
.prod .bas{display:flex;align-items:center;gap:8px;margin-top:10px}
.qte{display:inline-flex;align-items:center;border:1px solid var(--bord-champ);height:44px}
.qte button{width:44px;height:100%;border:0;background:none;font-size:18px}
.qte input{width:44px;height:100%;border:0;text-align:center;font-family:var(--mono);font-size:16px;background:none;-moz-appearance:textfield}
.qte input::-webkit-outer-spin-button,.qte input::-webkit-inner-spin-button{-webkit-appearance:none}
.dispo{font-size:12.5px;display:flex;align-items:center;gap:6px}
.dispo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--vert)}
.dispo.bas-stock::before{background:var(--safran)}
.dispo.rupture::before{background:var(--rouge)}
.paliers{font-size:12.5px;color:var(--encre-2);border-top:1px dashed var(--filet);padding-top:8px;margin-top:6px}

/* panier flottant + tiroir */
.flotte{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:14px;background:var(--lapis);color:var(--papier);padding:10px 10px 10px 18px;box-shadow:0 10px 30px rgba(27,36,64,.25);width:min(560px,calc(100% - 32px))}
.flotte .t{flex:1;font-size:14px;line-height:1.3}
.flotte .t b{font:500 16px/1 var(--mono);display:block;margin-top:2px}
.voile{position:fixed;inset:0;background:rgba(27,36,64,.45);z-index:50}
.tiroir{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--papier);z-index:51;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(27,36,64,.2)}
@media (prefers-reduced-motion:no-preference){.tiroir{animation:entre .28s cubic-bezier(.2,.7,.2,1)}@keyframes entre{from{transform:translateX(40px);opacity:0}}}
.tiroir .h{display:flex;align-items:center;justify-content:space-between;padding:18px var(--g);border-bottom:1px solid var(--filet)}
.tiroir .c{flex:1;overflow:auto;padding:18px var(--g)}
.tiroir .f{border-top:1px solid var(--filet);padding:16px var(--g) max(16px,env(safe-area-inset-bottom));background:var(--blanc)}
.fermer{background:none;border:0;width:44px;height:44px;font-size:24px;line-height:1;margin-right:-10px}
.ligne{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--filet)}
.ligne .n{font-size:15px}
.ligne .s{font-size:13px;color:var(--encre-2)}
.ligne .m{font-family:var(--mono);text-align:right}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14.5px;margin:12px 0}
.tot .gros{font-size:18px;font-weight:600}
.tot .num{text-align:right}
.choix{display:grid;gap:8px;margin:14px 0}
.choix label{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;border:1px solid var(--filet);background:var(--blanc);padding:12px;cursor:pointer}
.choix label:has(input:checked){border-color:var(--lapis);box-shadow:inset 0 0 0 1px var(--lapis)}
.choix input{margin:3px 0 0;accent-color:var(--lapis);grid-row:span 2}
.choix small{color:var(--encre-2);font-size:13px}
.note{font-size:13px;color:var(--encre-2)}
.alerte{padding:10px 12px;font-size:14px;background:var(--ambre-fond)}

/* modale */
.modale{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modale .boite{position:relative;background:var(--papier);width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:28px 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.modale .boite.large{width:min(860px,100%);text-align:left;justify-items:stretch;padding:0;background:#fff}
.qr{width:180px;height:180px;background:#fff;border:1px solid var(--filet);padding:10px}
.ok{width:56px;height:56px;border-radius:50%;background:var(--vert);color:#fff;display:grid;place-items:center;font-size:28px}
@media (prefers-reduced-motion:no-preference){.ok{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}@keyframes pop{from{transform:scale(.6);opacity:0}}}

/* tableaux */
.tab{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--blanc);border:1px solid var(--filet)}
.tab th{font:500 11.5px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;text-align:left;color:var(--encre-2);padding:10px 12px;border-bottom:1px solid var(--filet);background:#FAF7F1;white-space:nowrap}
.tab td{padding:11px 12px;border-bottom:1px solid #EEE8DC;vertical-align:middle}
.tab tr:last-child td{border-bottom:0}
.tab .d{text-align:right;font-family:var(--mono);white-space:nowrap}
.tab td.num{white-space:nowrap}
.defile{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:640px){
  .tab thead{display:none}
  .tab,.tab tbody,.tab tr,.tab td{display:block;width:100%}
  .tab tr{padding:12px 14px;border-bottom:1px solid var(--filet)}
  .tab tr:last-child{border-bottom:0}
  .tab td{border:0!important;padding:3px 0;min-width:0!important;text-align:left!important;white-space:normal!important}
  .tab td[data-l]:not(:empty)::before{content:attr(data-l);display:inline-block;min-width:96px;margin-right:8px;font:500 11px/1.4 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--encre-2)}
  .tab td:first-child{font-weight:600}
  .tab td .btn{width:100%;margin-top:8px;white-space:normal}
  .tab td:empty{display:none}
}
.statut{display:inline-block;padding:3px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.s-ok{background:var(--vert-fond);color:var(--vert)}
.s-att{background:var(--ambre-fond);color:#7A5512}
.s-ko{background:var(--rouge-fond);color:var(--rouge)}
.s-neutre{background:var(--papier-2);color:var(--encre-2)}

/* admin */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--blanc);border:1px solid var(--filet);padding:16px;display:grid;gap:4px;text-align:left}
button.kpi:hover{border-color:var(--lapis)}
.kpi .v{font:500 30px/1.05 var(--mono);letter-spacing:-.02em}
.kpi .l{font-size:14px;color:var(--encre-2)}
.kpi.chaud .v{color:var(--rouge)}
.taches{display:grid;gap:10px}
.tache{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--blanc);border:1px solid var(--filet);padding:14px 16px}
.tache .ic{width:36px;height:36px;display:grid;place-items:center;background:var(--papier-2);font:500 12px/1 var(--mono)}
.tache .t b{font-weight:500}
.tache .t p{font-size:13.5px;color:var(--encre-2)}
@media (max-width:620px){.tache{grid-template-columns:1fr}.tache .ic{display:none}.tache .btn{width:100%}}
.deux{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
@media (max-width:900px){.deux{grid-template-columns:1fr}}
.seuil{padding:20px;display:grid;gap:12px}
.jauge{height:14px;background:var(--papier-2);position:relative;overflow:hidden}
.jauge i{position:absolute;inset:0 auto 0 0;background:var(--safran);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.jauge.vert i{background:var(--vert)}
.legende{display:flex;justify-content:space-between;font-size:13px;color:var(--encre-2);gap:12px}
.chiffres{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:14.5px}
.chiffres .num{text-align:right}
.chiffres .sep{grid-column:1/-1;border-top:1px solid var(--filet);margin:4px 0}
.barres{display:flex;align-items:end;gap:10px;height:160px;padding:16px 16px 0}
.barres div{flex:1;display:grid;gap:6px;justify-items:center;align-content:end;height:100%}
.barres i{display:block;width:100%;max-width:44px;background:var(--lapis)}
.barres i.ce{background:var(--safran)}
.barres span{font:500 11px/1 var(--mono);color:var(--encre-2);padding-bottom:10px}
.vide{padding:28px;text-align:center;color:var(--encre-2);background:var(--blanc);border:1px dashed var(--filet)}

/* formulaire devis */
.form{display:grid;gap:14px;max-width:640px}
.form label{display:grid;gap:6px;font-size:14.5px;font-weight:500}
.form input,.form select,.form textarea{font-size:16px;border:1px solid var(--bord-champ);background:var(--blanc);padding:11px 12px;font-weight:400;min-height:44px;width:100%}
.form textarea{min-height:110px;resize:vertical}
.deux-champs{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.cases{display:flex;flex-wrap:wrap;gap:8px}
.cases label{display:flex;align-items:center;gap:8px;border:1px solid var(--filet);background:var(--blanc);padding:9px 12px;font-weight:400;min-height:44px}
.cases input{min-height:auto;width:auto;accent-color:var(--lapis)}

/* facture */
.facture{padding:36px 40px;color:#111;font-size:13.5px;line-height:1.45}
.facture .ent{display:flex;justify-content:space-between;gap:20px;align-items:start}
.facture .ent img{height:54px;width:auto}
.facture h2{font-size:24px;margin:28px 0 4px}
.facture .adr{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.facture table{width:100%;border-collapse:collapse;margin-top:22px}
.facture th{text-align:left;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid #111;padding:6px 4px}
.facture td{padding:7px 4px;border-bottom:1px solid #ddd}
.facture td:first-child{white-space:nowrap;font-family:var(--mono);font-size:12px}
.barre-fac .mono{white-space:nowrap}
.facture .d{text-align:right;font-family:var(--mono)}
.facture .tt{margin-left:auto;width:min(300px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-top:14px}
.facture .tt .g{font-weight:600;font-size:15px;border-top:1.5px solid #111;padding-top:6px}
.qrbill{margin-top:34px;border-top:1px dashed #555;padding-top:16px;display:grid;grid-template-columns:1fr 1.6fr;gap:24px}
.qrbill h4{margin:0 0 8px;font-size:13px}
.qrbill .qrc{display:grid;grid-template-columns:auto 1fr;gap:16px}
.qrbill .qrc .q{width:138px;height:138px}
.qrbill small{display:block;font-size:10.5px;font-weight:600;margin-top:6px}
.facture .ex{margin-top:16px;font-size:12px;color:#666}
.barre-fac{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--lapis);color:var(--papier);position:sticky;top:0}
.barre-fac .btn{border-color:var(--papier);color:var(--papier)}
@media (max-width:640px){.facture{padding:22px 18px}.facture .adr,.qrbill{grid-template-columns:1fr}.qrbill .qrc{grid-template-columns:1fr}}
@media print{

<body>
<div class="demo"><b>Démo</b> · clients, commandes et paiements fictifs. Rien n'est envoyé ni encaissé. <button class="btn lien" id="reinit" type="button">Remettre la démo à zéro</button></div>

<div class="barre">
  <div class="in">
    <a class="logo" href="../" aria-label="Karvan, site vitrine"><img src="../img/karvan-logo-inverse.svg" alt="Karvan" width="1000" height="360"></a>
    <div class="bascule" role="group" aria-label="Changer de vue">
      <button type="button" data-mode="client" aria-pressed="true">Vue client</button>
      <button type="button" data-mode="admin" aria-pressed="false">Vue Jalal</button>
    </div>

</div>

<main id="vue" tabindex="-1"></main>

<div id="flotte"></div>
<div id="calque"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const TVA = 0.081, LIVRAISON = 15, FRANCO = 150, COUT_LOT = 4334.65, AUJ = "2026-11-09";
const PALIERS = [{min:10, r:.06}, {min:5, r:.03}];
const r2 = x => Math.round(x * 100) / 100;
const IMG = { bol:"bol-kraft", couv:"couvercle-bol", pap:"papier-burger", box:"box-burger", gob:"gobelet", sac:"sac-kraft", piz:"boite-pizza", sau:"barquette-sauce-pet", pot:"pot-sauce-pp", sal:"barquette-salade" };
// ref, famille, nom, détail, pièces/carton, prix HT carton, coût complet carton, cartons reçus (lot 1), image, seuil d'alerte
const P = [
 ["BOL-1300","Bols","Bol kraft 1300 ml","Ø 184 × H 67",200,45.8,41.48,2,"bol",1],
 ["BOL-850","Bols","Bol kraft 850 ml","Ø 184 × H 47",200,35.6,38.87,3,"bol",1],
 ["BOL-750","Bols","Bol kraft 750 ml","Ø 144 × H 67",300,41.4,53.80,6,"bol",2],
 ["BOL-550","Bols","Bol kraft 550 ml","Ø 144 × H 50",300,38.4,52.82,6,"bol",2],
 ["COU-SM","Bols","Couvercle bol 550 / 750 ml","Ø 144, transparent",300,27,0,12,"couv",2],
 ["COU-LX","Bols","Couvercle bol 850 à 1300 ml","Ø 184, transparent",200,20,0,5,"couv",1],
 ["PAP-3040","Burger","Papier à burger 30 × 40","Ingraissable",1000,30,25.20,9,"pap",2],
 ["PAP-2530","Burger","Papier à burger 25 × 30","Ingraissable",1000,24,17.52,10,"pap",2],
 ["BOX-90","Burger","Petite box à burger","90 × 90 × 70 kraft",700,110,109.56,1,"box",1],
 ["PIZ-33","Pizza","Boîte à pizza 33 cm","330 × 330 × 40 kraft",100,24.8,24.45,30,"piz",5],
 ["GOB-30","Gobelets","Gobelet 30 cl / 12 oz","Ø 78 × H 115",2000,136,81.52,2,"gob",1],
 ["GOB-25","Gobelets","Gobelet 25 cl / 8 oz","Ø 78 × H 87",2000,96,63.91,2,"gob",1],
 ["GOB-10","Gobelets","Gobelet 10 cl / 4 oz","Ø 61 × H 60",3000,87,53.80,2,"gob",1],
 ["COUG-L","Gobelets","Couvercle gobelet 25 / 30 cl","Taille L",1000,76,34.56,2,"gob",1],
 ["SAC-L","Sacs","Sac kraft à poignées L","350 × 330 × 200",250,63,58.69,3,"sac",1],
 ["SAC-M","Sacs","Sac kraft à poignées M","290 × 280 × 160",250,38.4,48.91,8,"sac",2],
 ["SAC-S","Sacs","Sac kraft à poignées S","290 × 220 × 120",250,36.75,34.24,8,"sac",2],
 ["SAU-20","Sauces","Barquette à sauce 20 cc","Avec couvercle, PET",2700,97.2,52.82,1,"sau",1],
 ["SAU-30","Sauces","Barquette à sauce 30 cc","Avec couvercle, PET",2000,76,39.13,3,"sau",1],
 ["SAU-50","Sauces","Barquette à sauce 50 cc","Avec couvercle, PET",2000,96,39.13,3,"sau",1],
 ["SAU-80","Sauces","Barquette à sauce 80 cc","Avec couvercle, PET",2000,128,50.87,1,"sau",1],
 ["POT-30","Sauces","Pot à sauce rond 30 cc","Avec couvercle, PP",1000,70,39.13,3,"pot",1],
 ["SAL-150","Salades","Barquette salade 150 g","Avec couvercle",1000,68,39.13,3,"sal",1],
 ["SAL-250","Salades","Barquette salade 250 g","Avec couvercle",1000,90,58.69,3,"sal",1],
 ["SAL-500","Salades","Barquette salade 500 g","Avec couvercle",800,126.4,62.60,3,"sal",1]
].map(a => ({ref:a[0],fam:a[1],nom:a[2],det:a[3],pcs:a[4],prix:a[5],cout:a[6],recu:a[7],img:IMG[a[8]],alerte:a[9]}));
const PR = Object.fromEntries(P.map(p => [p.ref, p]));
const FAMS = ["Tout", ...new Set(P.map(p => p.fam))];

const CLIENTS = {
  "marco": {nom:"Pizzeria Da Marco", contact:"Marco Rinaldi", adr:"Rue de Carouge 54", ville:"1205 Genève", facture:true, statut:"Validé"},
  "bowl": {nom:"Bowl & Co", contact:"Léa Martin", adr:"Boulevard Helvétique 12", ville:"1207 Genève", facture:true, statut:"Validé"},
  "smash": {nom:"Smash House", contact:"Karim B.", adr:"Rue de Lausanne 88", ville:"1202 Genève", facture:true, statut:"Validé"},
  "cafe": {nom:"Café du Marché", contact:"Sophie Dubois", adr:"Place du Marché 3", ville:"1227 Carouge", facture:true, statut:"Validé"},
  "bosphore": {nom:"Kebab Le Bosphore", contact:"Emre Yilmaz", adr:"Rue de Berne 17", ville:"1201 Genève", facture:false, statut:"À valider"}
};
const MOI = "marco";

const seed = () => ({
  v: 3, panier: {}, num: {c:1007, d:202, f:2026019},
  commandes: [
    {n:"C-1001", cl:"smash", date:"2026-11-02", lignes:{"PAP-3040":2,"SAC-L":1,"SAU-30":1}, statut:"livree", paie:"twint", payee:true, fac:"F-2026014"},
    {n:"C-1002", cl:"marco", date:"2026-11-03", lignes:{"PIZ-33":8,"SAC-M":2}, statut:"livree", paie:"facture", payee:false, fac:"F-2026015"},
    {n:"C-1003", cl:"cafe", date:"2026-10-05", lignes:{"GOB-25":1,"COUG-L":1,"GOB-10":1}, statut:"livree", paie:"facture", payee:false, fac:"F-2026011"},
    {n:"C-1004", cl:"bowl", date:"2026-11-06", lignes:{"BOL-750":2,"COU-SM":3,"SAL-500":1,"BOL-1300":1,"COU-LX":1}, statut:"livree", paie:"carte", payee:true, fac:"F-2026016"},
    {n:"C-1005", cl:"marco", date:"2026-11-09", lignes:{"PIZ-33":6,"SAU-50":1}, statut:"apreparer", paie:"facture", payee:false, fac:null},
    {n:"C-1006", cl:"smash", date:"2026-11-08", lignes:{"PAP-2530":2,"SAC-S":2}, statut:"apreparer", paie:"twint", payee:true, fac:null}
  ],
  devis: [
    {n:"D-201", cl:"bowl", date:"2026-11-07", texte:"20 cartons de bols 750 ml avec notre logo imprimé sur le couvercle, livraison début décembre.", produits:"BOL-750, COU-SM", logo:true, statut:"aenvoyer", montant:null}
  ],
  mouvements: []
});
const CLE = "karvan-demo-espace";
let S;
try { S = JSON.parse(localStorage.getItem(CLE)); } catch (e) { S = null; }
if (!S || S.v !== 3) S = seed();
Object.entries(S.valides || {}).forEach(([k, v]) => { if (CLIENTS[k]) Object.assign(CLIENTS[k], v); });
const save = () => { try { localStorage.setItem(CLE, JSON.stringify(S)); } catch (e) {} };

let mode = "connexion", onglet = "commander", famille = "Tout", attente = null;

// ---------- calculs ----------
const chf = x => x.toLocaleString("fr-CH", {minimumFractionDigits:2, maximumFractionDigits:2});
const chf0 = x => Math.round(x).toLocaleString("fr-CH");
// pas de remise sur les produits vendus sous leur coût complet (« prix de lancement »)
const lancement = ref => !!(ref && PR[ref] && PR[ref].cout > PR[ref].prix);
const remise = (q, ref) => lancement(ref) ? 0 : (PALIERS.find(p => q >= p.min) || {r:0}).r;
const prixU = (ref, q) => r2(PR[ref].prix * (1 - remise(q, ref)));
// calcul au centime : chaque ligne arrondie, puis la TVA
const totHT = lignes => r2(Object.entries(lignes).reduce((s, [r, q]) => s + r2(prixU(r, q) * q), 0));
const coutC = lignes => Object.entries(lignes).reduce((s, [r, q]) => s + PR[r].cout * q, 0);
const port = ht => ht >= FRANCO || ht === 0 ? 0 : LIVRAISON;
const totaux = lignes => { const ht = totHT(lignes), p = port(ht), tva = r2((ht + p) * TVA); return {ht, p, tva, ttc: r2(ht + p + tva)}; };
const numC = n => parseInt(String(n).replace(/\D/g, ""), 10) || 0;
const recent = (a, b) => b.date.localeCompare(a.date) || numC(b.n) - numC(a.n);
const sorti = ref => S.commandes.filter(c => c.statut === "livree").reduce((s, c) => s + (c.lignes[ref] || 0), 0);
const reserve = ref => S.commandes.filter(c => c.statut === "apreparer").reduce((s, c) => s + (c.lignes[ref] || 0), 0);
const stock = ref => PR[ref].recu - sorti(ref) + S.mouvements.filter(m => m.ref === ref).reduce((s, m) => s + m.q, 0);
const dispo = ref => stock(ref) - reserve(ref);
const addJ = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const dfr = d => { const [y, m, j] = d.split("-"); return `${j}.${m}.${y}`; };
const echeance = c => addJ(c.date, 30);
const enRetard = c => c.statut === "livree" && !c.payee && echeance(c) < AUJ;
const nbArt = lignes => Object.values(lignes).reduce((a, b) => a + b, 0);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

// ---------- rendu général ----------
const $ = s => document.querySelector(s);
const vue = $("#vue");
const ONGLETS = {
  client: [["commander","Commander"],["devis","Demander un devis"],["commandes","Mes commandes"],["factures","Mes factures"]],
  admin: [["auj","Aujourd'hui"],["argent","Argent"],["stock","Stock"],["cmd","Commandes et devis"],["clients","Clients"],["prix","Produits et prix"]]
};
function badge(id) {
  if (id === "auj") { const n = S.commandes.filter(c => c.statut === "apreparer").length + S.devis.filter(d => d.statut === "aenvoyer").length + S.commandes.filter(enRetard).length + Object.values(CLIENTS).filter(c => c.statut === "À valider").length; return n ? `<span class="pastille">${n}</span>` : ""; }
  if (id === "stock") { const n = P.filter(p => dispo(p.ref) <= p.alerte).length; return n ? `<span class="pastille rouge">${n}</span>` : ""; }
  if (id === "factures") { const n = S.commandes.filter(c => c.cl === MOI && c.fac && !c.payee).length; return n ? `<span class="pastille">${n}</span>` : ""; }
  return "";
}
function vueConnexion() {
  return `<section class="cnx" aria-labelledby="tc">
    <div>
      <h1 id="tc">Espace pro Karvan</h1>
      <p class="chap">Réservé aux professionnels clients : restaurants, snacks, boulangeries, traiteurs, cafés, épiceries. Vos prix, vos commandes et vos factures au même endroit.</p>
      <ul class="plus"><li>Prix pro et remises par quantité</li><li>Commande en 1 minute, ou recommande la dernière</li><li>Paiement TWINT, ou sur facture à 30 jours pour les clients réguliers</li><li>Factures et devis toujours à portée de main</li></ul>
    </div>
    <div class="carte">
      <h2><span class="m">Espace pro · </span>Se connecter</h2>
      <form data-form="cnx" novalidate><label>E-mail<input name="e" type="email" autocomplete="username" placeholder="vous@entreprise.ch" required aria-describedby="cnx-err"></label><p class="err" id="cnx-err" hidden></p>
      <label>Mot de passe<input name="m" type="password" autocomplete="current-password"></label>
      <button class="btn plein" type="submit" style="width:100%">Se connecter</button></form>
      <p class="ou">Démo · entrer sans mot de passe</p>
      <div class="comptes">
        <button class="compte" type="button" data-mode="client"><span><b>Client pro</b><small>${esc(CLIENTS[MOI].nom)} · vue commande</small></span><span class="f" aria-hidden="true">→</span></button>
        <button class="compte" type="button" data-mode="admin"><span><b>Jalal · administrateur</b><small>Stock, argent, commandes, clients</small></span><span class="f" aria-hidden="true">→</span></button>
      </div>
      <p class="pied">Pas encore client ? <a href="../#contact">Demander un compte pro</a></p>
    </div>
  </section>`;
}
function rendre(focus) {
  document.body.classList.toggle("login", mode === "connexion");
  if (mode === "connexion") { vue.innerHTML = vueConnexion(); rendreFlotte(); if (focus) window.scrollTo({top:0}); return; }
  document.querySelectorAll(".bascule button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("#qui").innerHTML = mode === "client" ? `Connecté<b>${CLIENTS[MOI].nom}</b>` : `Connecté<b>Jalal · admin</b>`;
  $("#onglets").innerHTML = ONGLETS[mode].map(([id, l]) => `<button role="tab" type="button" data-onglet="${id}" aria-selected="${id === onglet}">${l}${badge(id)}</button>`).join("");
  vue.innerHTML = (VUES[onglet] || (() => ""))();
  vue.querySelectorAll(".tab").forEach(t => { const th = [...t.querySelectorAll("thead th")].map(x => x.textContent.trim()); t.querySelectorAll("tbody tr").forEach(tr => [...tr.children].forEach((td, i) => { if (th[i]) td.dataset.l = th[i]; })); });
  const sel = document.querySelector('#onglets [aria-selected="true"]'); if (sel) { const bar = $("#onglets"); bar.scrollLeft = Math.max(0, sel.offsetLeft - 16); }
  rendreFlotte();
  if (focus) { window.scrollTo({top:0}); vue.focus({preventScroll:true}); }
}
function toast(t) {
  const el = $("#toast"); el.innerHTML = `<div class="toast">${t}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.innerHTML = "", 3200);
}

// ---------- vues client ----------
const VUES = {};
VUES.commander = () => {
  const der = S.commandes.filter(c => c.cl === MOI).sort(recent)[0];
  const liste = P.filter(p => famille === "Tout" || p.fam === famille);
  return `
  <div class="tete"><div><p class="mono" style="color:var(--safran-texte)">Bonjour Marco</p><h1>Commander</h1></div>
  ${der ? `<button class="btn" type="button" data-act="recommander" data-n="${der.n}">Recommander ma dernière commande (${nbArt(der.lignes)} cartons)</button>` : ""}</div>
  <div class="outils">
    <form class="rapide" data-form="rapide" autocomplete="off"><label class="sr" for="rr">Commande rapide par référence</label>
      <input id="rr" name="r" placeholder="Commande rapide, ex. : PIZ-33 6" list="refs"><button class="btn plein petit" type="submit">Ajouter</button></form>
    <datalist id="refs">${P.map(p => `<option value="${p.ref}">${esc(p.nom)}</option>`).join("")}</datalist>
  </div>
  <div class="filtres" role="group" aria-label="Familles">${FAMS.map(f => `<button type="button" data-fam="${f}" aria-pressed="${f === famille}">${f}</button>`).join("")}</div>
  <p class="note" style="margin-bottom:14px">Prix HT par carton. Dès 5 cartons d'un même produit : −3 %. Dès 10 : −6 % (hors prix de lancement). Livraison offerte dès ${FRANCO} CHF HT, sinon ${LIVRAISON} CHF.</p>
  <div class="grille">${liste.map(carteProd).join("")}</div>`;
};
function carteProd(p) {
  const d = dispo(p.ref), q = S.panier[p.ref] || 0;
  const etat = d <= 0 ? ["rupture","Rupture, réassort en cours"] : d <= p.alerte ? ["bas-stock",`Plus que ${d} carton${d > 1 ? "s" : ""}`] : ["", "En stock, livré sous 48 h"];
  return `<article class="prod">
    <div class="vis"><img src="../img/${p.img}.webp" alt="" loading="lazy" width="600" height="600"></div>
    <div class="corps">
      <span class="mono ref">${p.ref}</span>
      <h3>${esc(p.nom)}</h3>
      <p class="det">${esc(p.det)} · ${p.pcs.toLocaleString("fr-CH")} pièces par carton</p>
      <div class="prix"><b>${chf(p.prix)}</b><span>CHF HT le carton</span></div>
      <p class="pp num">${(p.prix / p.pcs).toFixed(3)} CHF la pièce</p>
      <p class="dispo ${etat[0]}">${etat[1]}</p>
      <div class="bas">
        <div class="qte"><button type="button" data-moins="${p.ref}" aria-label="Retirer un carton de ${esc(p.nom)}">−</button><input type="number" inputmode="numeric" min="0" value="${q}" data-q="${p.ref}" aria-label="Cartons de ${esc(p.nom)}"><button type="button" data-plus="${p.ref}" aria-label="Ajouter un carton de ${esc(p.nom)}" ${d - q <= 0 ? "disabled" : ""}>+</button></div>
        ${remise(q, p.ref) ? `<span class="statut s-ok">−${remise(q, p.ref) * 100} %</span>` : q >= 5 && lancement(p.ref) ? `<span class="statut s-neutre">Prix de lancement</span>` : ""}
      </div>
    </div></article>`;
}
function rendreFlotte() {
  const n = nbArt(S.panier), f = $("#flotte");
  if (mode !== "client" || !n || $("#calque").innerHTML) { f.innerHTML = ""; return; }
  const t = totaux(S.panier);
  f.innerHTML = `<div class="flotte"><div class="t">${n} carton${n > 1 ? "s" : ""}<b>${chf(t.ht)} CHF HT</b></div><button class="btn saf" type="button" data-act="panier">Voir le panier</button></div>`;
}
function ouvrirPanier() {
  $("#toast").innerHTML = "";
  const t = totaux(S.panier), cl = CLIENTS[MOI];
  const lignes = Object.entries(S.panier);
  $("#calque").innerHTML = `<div class="voile" data-act="fermer"></div>
  <aside class="tiroir" role="dialog" aria-modal="true" aria-labelledby="tp">
    <div class="h"><h2 id="tp">Votre commande</h2><button class="fermer" type="button" data-act="fermer" aria-label="Fermer">×</button></div>
    <div class="c">
      ${lignes.length ? lignes.map(([r, q]) => `<div class="ligne"><div><p class="n">${q} × ${esc(PR[r].nom)}</p><p class="s"><span class="num">${r}</span> · ${chf(prixU(r, q))} CHF le carton${remise(q, r) ? ` (−${remise(q, r) * 100} %)` : ""}</p></div><p class="m">${chf(prixU(r, q) * q)}</p></div>`).join("") : `<p class="vide">Panier vide.</p>`}
      <div class="tot"><span>Marchandise HT</span><span class="num">${chf(t.ht)}</span><span>Livraison HT</span><span class="num">${t.p ? chf(t.p) : "offerte"}</span><span>TVA 8,1 %</span><span class="num">${chf(t.tva)}</span><span class="gros">Total TTC</span><span class="num gros">${chf(t.ttc)} CHF</span></div>
      ${t.p ? `<p class="alerte">Encore ${chf(FRANCO - t.ht)} CHF HT pour la livraison offerte.</p>` : ""}
      <fieldset class="choix" style="border:0;padding:0"><legend class="mono" style="margin-bottom:8px">Paiement</legend>
        <label><input type="radio" name="paie" value="twint" checked><span>TWINT</span><small>Vous scannez le code, c'est payé tout de suite.</small></label>
        <label><input type="radio" name="paie" value="facture" ${cl.facture ? "" : "disabled"}><span>Sur facture à 30 jours</span><small>${cl.facture ? "Facture QR envoyée à la livraison. Réservé aux comptes validés." : "Activée par Jalal pour ses clients réguliers."}</small></label>
      </fieldset>
      <p class="note">Livraison à ${esc(cl.nom)}, ${esc(cl.adr)}, ${esc(cl.ville)}.</p>
    </div>
    <div class="f"><button class="btn plein" style="width:100%" type="button" data-act="valider" ${lignes.length ? "" : "disabled"}>Valider la commande · ${chf(t.ttc)} CHF</button></div>
  </aside>`;
  rendreFlotte();
  setTimeout(() => $(".tiroir .fermer")?.focus(), 30);
}
function fermerCalque() { if (attente) { clearTimeout(attente); attente = null; toast("Paiement annulé. Rien n'a été débité, votre panier est conservé."); } const ouvert = $("#calque").innerHTML; $("#calque").innerHTML = ""; rendreFlotte(); if (ouvert && retourFocus && document.contains(retourFocus)) retourFocus.focus(); retourFocus = null; }
let retourFocus = null;
function valider() {
  const paie = (document.querySelector("input[name=paie]:checked") || {}).value || "twint";
  const t = totaux(S.panier);
  if (paie === "facture") return finaliser(paie);
  const corps = paie === "twint"
    ? `<p class="mono">Paiement TWINT</p><h2>${chf(t.ttc)} CHF</h2>${qrSvg(37, "qr")}<p class="calme">Scannez avec l'app TWINT.<br>Dans la démo, le paiement se valide tout seul.</p>`
    : `<p class="mono">Paiement par carte</p><h2>${chf(t.ttc)} CHF</h2><div class="carte" style="width:100%;padding:14px;text-align:left;font-family:var(--mono);font-size:14px;color:var(--encre-2)">4242 4242 4242 4242 · 12/29 · 123</div><p class="calme">Page de paiement sécurisée (Payrexx). Dans la démo, rien n'est débité.</p>`;
  const fige = {...S.panier};

function qrSvg(n, cls) {
  let h = 2166136261, cells = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const coin = (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
    h = Math.imul(h ^ (x * 31 + y * 17 + 7), 16777619) >>> 0;
    if (!coin && (h & 7) < 4) cells += `M${x} ${y}h1v1h-1z`;
  }
  const oeil = (x, y) => `<path d="M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5z" fill-rule="evenodd"/><path d="M${x + 2} ${y + 2}h3v3h-3z"/>`;
  return `<svg class="${cls}" viewBox="0 0 ${n} ${n}" aria-label="Code QR d'exemple" role="img" shape-rendering="crispEdges"><path d="${cells}"/>${oeil(0, 0)}${oeil(n - 7, 0)}${oeil(0, n - 7)}<rect x="${n / 2 - 3.5}" y="${n / 2 - 3.5}" width="7" height="7" fill="#fff"/><path d="M${n / 2 - 2.5} ${n / 2 - 1}h5v2h-5zM${n / 2 - 1} ${n / 2 - 2.5}h2v5h-2z" fill="#000"/></svg>`;
}
function voirFacture(n) {
  const c = S.commandes.find(o => o.n === n), cl = CLIENTS[c.cl], t = totaux(c.lignes);
  $("#calque").innerHTML = `<div class="voile" data-act="fermer"></div><div class="modale" role="dialog" aria-modal="true" aria-label="Facture ${c.fac}"><div class="boite large">
  <div class="barre-fac"><span class="mono">${c.fac}</span><span style="display:flex;gap:8px"><button class="btn petit" type="button" data-act="imprimer">Imprimer / PDF</button><button class="btn petit" type="button" data-act="fermer">Fermer</button></span></div>
  <div class="facture imprimable">
    <div class="ent"><img src="../img/karvan-logo.svg" alt="Karvan" width="1000" height="360"><div style="text-align:right">Karvan · Jalal<br>Genève (adresse à compléter)<br>TVA CHE-000.000.000 (exemple)</div></div>
    <div class="adr"><div><b>Facturé à</b><br>${esc(cl.nom)}<br>${esc(cl.contact)}<br>${esc(cl.adr)}<br>${esc(cl.ville)}</div><div><b>Facture ${c.fac}</b><br>Date : ${dfr(c.date)}<br>Commande : ${c.n}<br>Échéance : ${dfr(echeance(c))}<br>Statut : ${c.payee ? "payée" : "à payer"}</div></div>
    <table><thead><tr><th>Réf.</th><th>Désignation</th><th class="d">Cartons</th><th class="d">Prix HT</th><th class="d">Total HT</th></tr></thead><tbody>
    ${Object.entries(c.lignes).map(([r, q]) => `<tr><td>${r}</td><td>${esc(PR[r].nom)}${remise(q, r) ? ` (−${remise(q, r) * 100} %)` : ""}</td><td class="d">${q}</td><td class="d">${chf(prixU(r, q))}</td><td class="d">${chf(prixU(r, q) * q)}</td></tr>`).join("")}
    ${t.p ? `<tr><td></td><td>Livraison</td><td class="d">1</td><td class="d">${chf(t.p)}</td><td class="d">${chf(t.p)}</td></tr>` : ""}
    </tbody></table>
    <div class="tt"><span>Total HT, livraison comprise</span><span class="d">${chf(t.ht + t.p)}</span><span>TVA 8,1 %</span><span class="d">${chf(t.tva)}</span><span class="g">Total TTC CHF</span><span class="g d">${chf(t.ttc)}</span></div>
    <div class="qrbill"><div><h4>Récépissé</h4>Compte / Payable à<br>CH00 0000 0000 0000 0000 0 (QR-IBAN d'exemple)<br>Karvan, Genève<br><br>Payable par<br>${esc(cl.nom)}<br><br><b>Montant CHF ${chf(t.ttc)}</b></div>
    <div><h4>Section paiement</h4><div class="qrc">${qrSvg(37, "q")}<div>Référence<br>00 00000 ${c.fac.replace("F-", "")} 00000<br><br>Informations<br>Facture ${c.fac}, commande ${c.n}<br><br><b>Montant CHF ${chf(t.ttc)}</b></div></div><small>Code QR d'exemple, il ne se paie pas.</small></div></div>
    <p class="ex">Facture d'exemple. Dans la version finale, elle est créée par bexio, envoyée par e-mail au client et copiée dans le dossier Drive « Karvan / Factures / ${c.date.slice(0, 7)} ».</p>
  </div></div></div>`;
  rendreFlotte();
}

// ---------- actions ----------
function ajouter(ref, q) {
  const p = PR[ref]; if (!p) return false;
  const max = dispo(ref); const n = Math.max(0, Math.min(max, (S.panier[ref] || 0) + q));
  if (n) S.panier[ref] = n; else delete S.panier[ref];
  save(); return true;
}
function majCarte(ref) {
  const art = document.querySelector(`[data-q="${ref}"]`)?.closest(".prod");
  const a = document.activeElement, cle = a && art && art.contains(a) ? (a.dataset.plus ? "plus" : a.dataset.moins ? "moins" : a.dataset.q ? "q" : null) : null;
  if (art) { const tmp = document.createElement("div"); tmp.innerHTML = carteProd(PR[ref]); art.replaceWith(tmp.firstElementChild); }
  if (cle) { let el = document.querySelector(`[data-${cle}="${ref}"]`); if (!el || el.disabled) el = document.querySelector(`[data-q="${ref}"]`); el?.focus(); }
  rendreFlotte();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-act]"); if (!b) return;
  const d = b.dataset;
  if (d.act === "deco") { S.panier = {}; save(); mode = "connexion"; history.replaceState(null, "", location.pathname); fermerCalque(); rendre(true); toast("Vous êtes déconnecté."); return; }
  if (d.mode) { mode = d.mode; history.replaceState(null, "", "#" + mode); onglet = mode === "client" ? "commander" : "auj"; fermerCalque(); rendre(true); return; }
  if (d.onglet) { onglet = d.onglet; history.pushState(null, "", `#${mode}/${onglet}`); rendre(true); return; }
  if (d.go) { onglet = d.go; history.pushState(null, "", `#${mode}/${onglet}`); rendre(true); return; }
  if (d.fam) { famille = d.fam; rendre(); document.querySelector(`[data-fam="${famille}"]`)?.focus(); return; }
  if (d.plus) { ajouter(d.plus, 1); majCarte(d.plus); return; }
  if (d.moins) { ajouter(d.moins, -1); majCarte(d.moins); return; }
  switch (d.act) {
    case "panier": retourFocus = b; history.pushState({calque:1}, "", location.hash || "#client"); ouvrirPanier(); break;
    case "fermer": fermerCalque(); break;
    case "valider": valider(); break;
    case "voircmd": fermerCalque(); onglet = "commandes"; history.pushState(null, "", `#${mode}/${onglet}`); rendre(true); break;
    case "recommander": { const c = S.commandes.find(o => o.n === d.n); let manque = 0; Object.entries(c.lignes).forEach(([r, q]) => { const avant = S.panier[r] || 0; ajouter(r, q); if ((S.panier[r] || 0) - avant < q) manque++; }); if (onglet !== "commander") { onglet = "commander"; rendre(true); } else rendre(); ouvrirPanier(); if (manque) toast("Certains produits ne sont plus assez en stock : quantités ajustées."); break; }
    case "livrer": { const c = S.commandes.find(o => o.n === d.n); if (!c || c.statut !== "apreparer") break; b.disabled = true; c.statut = "livree"; c.livree = AUJ; c.fac = "F-" + S.num.f++; save(); rendre(); toast(`${c.n} livrée. Facture ${c.fac} envoyée à ${CLIENTS[c.cl].nom}, stock mis à jour.`); break; }
    case "chiffrer": { const dv = S.devis.find(o => o.n === d.n); dv.statut = "envoye"; dv.montant = dv.logo ? 20 * 58.9 + 290 : 20 * 41.4; save(); rendre(); toast(`Devis ${dv.n} envoyé à ${CLIENTS[dv.cl].nom} (${chf(dv.montant)} CHF HT).`); break; }
    case "accepter": { const dv = S.devis.find(o => o.n === d.n); dv.statut = "accepte"; save(); rendre(); toast("Devis accepté. Jalal est prévenu et prépare votre commande."); break; }
    case "marquerpayee": { const c = S.commandes.find(o => o.n === d.n); if (!c || c.payee) break; c.payee = true; c.payeeLe = AUJ; save(); rendre(); toast(`${c.fac} marquée payée le ${dfr(AUJ)} (virement QR). Elle sort des relances.`); break; }
    case "relancer": { const c = S.commandes.find(o => o.n === d.n); S.rappels = S.rappels || {}; S.rappels[c.n] = AUJ; save(); rendre(); toast(`Rappel envoyé à ${CLIENTS[c.cl].nom} avec la facture ${c.fac} et le lien de paiement TWINT.`); break; }
    case "valcli": CLIENTS[d.k].statut = "Validé"; S.valides = S.valides || {}; S.valides[d.k] = {statut:"Validé", facture:false}; save(); rendre(); toast(`${CLIENTS[d.k].nom} peut maintenant voir vos prix et commander (paiement TWINT ; la facture à 30 jours s'active plus tard, client par client).`); break;
    case "facture": retourFocus = b; history.pushState({calque:1}, "", location.hash || "#" + mode); voirFacture(d.n); break;
    case "imprimer": window.print(); break;
    case "payer": { const c = S.commandes.find(o => o.n === d.n); const t = totaux(c.lignes); $("#calque").innerHTML = `<div class="voile"></div><div class="modale" role="dialog" aria-modal="true" aria-label="Paiement"><div class="boite"><p class="mono">Payer ${c.fac} en TWINT</p><h2>${chf(t.ttc)} CHF</h2>${qrSvg(37, "qr")}<p class="note">Validation…</p><button class="btn" type="button" data-act="fermer">Annuler</button></div></div>`; retourFocus = b; setTimeout(() => $(".modale .btn")?.focus(), 30); attente = setTimeout(() => { attente = null; c.payee = true; save(); fermerCalque(); rendre(); toast(`Facture ${c.fac} payée. Merci !`); }, 2000); break; }
    case "arrivage": { const ref = "PIZ-33"; S.mouvements.push({ref, q:20, date:AUJ}); save(); rendre(); toast("Exemple : arrivage de 20 cartons de PIZ-33 ajouté au stock."); break; }
  }
});
document.addEventListener("change", e => {
  const i = e.target.closest("[data-q]"); if (!i) return;
  const ref = i.dataset.q, v = Math.max(0, parseInt(i.value, 10) || 0);
  S.panier[ref] = 0; delete S.panier[ref]; ajouter(ref, v); majCarte(ref);
  if ((S.panier[ref] || 0) < v) toast(`Seulement ${dispo(ref)} carton${dispo(ref) > 1 ? "s" : ""} disponible${dispo(ref) > 1 ? "s" : ""}.`);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "cnx") { const err = f.querySelector(".err"); if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(f.e.value.trim())) { err.textContent = "Entrez votre adresse e-mail professionnelle."; err.hidden = false; f.e.setAttribute("aria-invalid", "true"); f.e.focus(); return; } if (!f.m.value) { err.textContent = "Entrez votre mot de passe, ou utilisez un accès démo ci-dessous."; err.hidden = false; f.m.focus(); return; } mode = /jalal|karvan|admin/i.test(f.e.value) ? "admin" : "client"; onglet = mode === "client" ? "commander" : "auj"; history.replaceState(null, "", "#" + mode); rendre(true); return; }
  if (f.dataset.form === "rapide") {
    const brut = f.r.value.trim().toUpperCase().replace(/\s+/g, " ");
    const m = brut.match(/^([A-Z]+)\s?-?\s?([A-Z0-9]+)(?:\s*[X×]?\s*(-?\S+))?$/);
    const ref = m && (PR[`${m[1]}-${m[2]}`] ? `${m[1]}-${m[2]}` : null);
    if (!ref) { toast("Référence inconnue. Exemple : PIZ-33 6"); return; }
    const q = m[3] === undefined ? 1 : Number(m[3]);
    if (!Number.isInteger(q) || q < 1 || q > 999) { toast("Quantité invalide : indiquez un nombre de cartons entre 1 et 999."); return; }
    const avant = S.panier[ref] || 0; ajouter(ref, q); f.r.value = ""; majCarte(ref);
    if ((S.panier[ref] || 0) - avant < q) { toast(`Seulement ${dispo(ref)} carton${dispo(ref) > 1 ? "s" : ""} disponible${dispo(ref) > 1 ? "s" : ""} : ${S.panier[ref] || 0} dans le panier.`); return; }
    toast(`${S.panier[ref] || 0} × ${PR[ref].nom} dans le panier.`);
  }
  if (f.dataset.form === "devis") {
    if (!f.p.value && !f.q.value.trim() && !f.m.value.trim()) { toast("Dites-nous au moins quel produit, quelle quantité ou votre besoin."); f.m.focus(); return; }
    const txt = [f.p.value ? PR[f.p.value].nom : "Plusieurs produits", f.q.value, f.m.value].filter(Boolean).join(" · ");
    S.devis.push({n:"D-" + S.num.d++, cl:MOI, date:AUJ, texte:txt || "Demande de devis", produits:f.p.value, logo:f.logo.checked, statut:"aenvoyer", montant:null});
    save(); rendre(); toast("Demande envoyée. Jalal vous répond sous 24 h.");
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#calque").innerHTML) fermerCalque(); });
$("#reinit").addEventListener("click", () => { S = seed(); CLIENTS.bosphore.statut = "À valider"; save(); mode = "connexion"; history.replaceState(null, "", location.pathname); onglet = "commander"; famille = "Tout"; fermerCalque(); rendre(true); toast("Démo remise à zéro."); });

function lireAdresse() {
  const [m, o] = location.hash.slice(1).split("/");
  if (m === "admin" || m === "client") { mode = m; onglet = ONGLETS[m].some(([id]) => id === o) ? o : (m === "client" ? "commander" : "auj"); }
  else mode = "connexion";
}
window.addEventListener("popstate", () => {
  if ($("#calque").innerHTML) { fermerCalque(); if (history.state && history.state.calque) return; }
  lireAdresse(); rendre(true);
});
// le focus reste dans le panier ou la fenêtre ouverte
document.addEventListener("keydown", e => {
  if (e.key !== "Tab" || !$("#calque").innerHTML) return;
  const f = [...$("#calque").querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const premier = f[0], dernier = f[f.length - 1];
  if (!$("#calque").contains(document.activeElement)) { e.preventDefault(); premier.focus(); }
  else if (e.shiftKey && document.activeElement === premier) { e.preventDefault(); dernier.focus(); }
  else if (!e.shiftKey && document.activeElement === dernier) { e.preventDefault(); premier.focus(); }
});
lireAdresse();
rendre();
})();
</script>
