# Certificat HTTPS de nouvelleardoise.ch (GitHub Pages) : diagnostic, à lancer à la main depuis
# l'onglet Actions. Affiche le domaine, l'état du certificat et le HTTPS forcé ou non.
# Le jeton du dépôt peut lire ces réglages mais pas les modifier (erreur 403) : relancer le
# certificat ou forcer le HTTPS se fait dans Settings → Pages.
name: HTTPS

on:
  workflow_dispatch:

permissions:
  pages: read

jobs:
  https:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPOT: ${{ github.repository }}
    steps:
      - name: État actuel
        run: |
          gh api "repos/$DEPOT/pages" | jq '{cname, build_type, https_enforced, https_certificate}'
